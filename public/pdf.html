<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 乐谱｜CUCAC.Hub</title><meta name="robots" content="noindex"><meta name="theme-color" content="#f3ecdf"><link rel="icon" href="/icon-192.png"><style>
:root{color-scheme:light;--ink:#241c16;--line:#e4d8c8;--paper:#f3ecdf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}header{background:#fffaf3;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:16px;margin:0;flex:1;min-width:120px;overflow-wrap:anywhere}button,a,select,input{font:inherit}button,.button,select{border:1px solid var(--line);border-radius:8px;background:#fffaf3;color:var(--ink);padding:7px 11px;text-decoration:none;font-size:13px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;padding:12px}#file{max-width:min(90vw,450px)}#page-number{width:50px;border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center}#stage{overflow:auto;padding:10px 12px 30px;min-height:70vh;text-align:center}canvas{background:white;box-shadow:0 2px 12px #223b3220;display:block;margin:auto}#message{white-space:pre-line;margin:12px auto;max-width:650px;padding:0 16px;font-size:14px;line-height:1.7}#manage{margin:auto;max-width:650px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#upload{max-width:100%}.hint{font-size:12px;opacity:.7}#manage[hidden],.tools[hidden],canvas[hidden]{display:none}@media(max-width:500px){header{padding:10px}button,.button,select{padding:6px 9px}.tools{gap:6px}}
body.reading-mode header,body.reading-mode #files-tools,body.reading-mode #manage{display:none !important;}body.reading-mode #stage{position:fixed;inset:0 0 66px;padding:8px 6px 20px;min-height:0;background:var(--paper);}body.reading-mode #page-tools{position:fixed;bottom:0;left:0;right:0;z-index:4;min-height:66px;padding:8px;background:#fffaf3;border-top:1px solid var(--line);}#exit-fullscreen{position:fixed;top:8px;right:8px;z-index:5;background:#fffaf3e8;}body.reading-mode #message:not(:empty){position:fixed;top:44px;z-index:5;background:var(--paper);}#exit-fullscreen[hidden]{display:none;}
</style></head><body><header><button id="back">返回 / Back</button><h1 id="title">PDF 乐谱 / Scores</h1><a id="drive" class="button" target="_blank" rel="noopener">Drive</a><button id="fullscreen" disabled>全屏 / Fullscreen</button><button id="download" disabled>下载 / Download</button></header><div class="tools" id="files-tools" hidden><select id="file" aria-label="选择 PDF / Choose PDF"></select><button id="star" hidden>设为默认 ★ / Set default</button></div><div id="message" role="status">正在读取 PDF… / Loading PDF…</div><div id="manage" hidden><span class="hint">★ 是 Hub 优先打开的最新版 PDF；仅有一个时自动选中。<br>★ marks the latest PDF Hub opens by default. A single PDF is selected automatically.</span><label class="button">补上传 PDF / Add PDF<input type="file" id="upload" accept="application/pdf,.pdf" hidden></label><span class="hint">单次上传小于 4 MB；较大文件可上传到 Drive 后刷新。<br>Upload under 4 MB here; add larger files in Drive, then refresh.</span></div><div class="tools" id="page-tools" hidden><button id="previous">‹</button><input id="page-number" type="number" min="1" value="1" aria-label="页码 / Page"><span id="count"></span><button id="next">›</button><button id="smaller">−</button><button id="fit">适宽 / Fit</button><button id="larger">+</button><span id="zoom" class="hint"></span></div><button id="exit-fullscreen" hidden>退出全屏 / Exit fullscreen</button><main id="stage"><canvas id="canvas" hidden></canvas></main><script type="module" src="/pdf-viewer.mjs"></script></body></html>
