0c\u81f3\u5c11\u9009\u4e00\u9879\uff0c\u4e5f\u53ef\u4ee5\u540c\u65f6\u9009\u4e24\u9879\u3002\u003c/li>\n\u003cli>\u9009\u62e9\u4e00\u4e2a\u6216\u591a\u4e2a\u6587\u4ef6\uff0c\u6216\u4f7f\u7528\u652f\u6301\u6587\u4ef6\u5939\u9009\u62e9\u7684\u6d4f\u89c8\u5668\u4e0a\u4f20\u6587\u4ef6\u5939\u3002\u003c/li>\n\u003cli>\u70b9\u51fb \u003cstrong>\u4e0a\u4f20\u003c/strong>\uff0c\u7b49\u5f85\u6210\u529f\u63d0\u793a\u3002\u003c/li>\n\u003c/ol>\n\u003cp>\u6587\u4ef6\u4f1a\u653e\u5230 \u003ccode>\u793e\u56e2\u5927\u6587\u4ef6\u5939 \u2192 \u5b66\u671f \u2192 \u66f2\u540d\u003c/code> \u4e0b\uff0c\u540c\u65f6\u5728 Google Sheets \u4e50\u8c31\u7d22\u5f15\u4e2d\u6dfb\u52a0\u8bb0\u5f55\u3002\u5e38\u89c1\u4e50\u8c31\u683c\u5f0f\u5305\u62ec PDF\u3001MuseScore \u003ccode>.mscz\u003c/code>\u3001MusicXML \u003ccode>.musicxml\u003c/code> / \u003ccode>.xml\u003c/code> / \u003ccode>.mxl\u003c/code> \u548c\u56fe\u7247\u3002\u003c/p>\n\u003cp>\u7ebf\u4e0a\u7248\u6bcf\u6b21\u4e0a\u4f20\u7684\u003cstrong>\u6240\u6709\u6587\u4ef6\u5408\u8ba1\u9700\u5c0f\u4e8e 20 MB\u003c/strong>\uff0c\u4e0d\u662f\u6bcf\u4e2a\u6587\u4ef6\u5404\u6709 20 MB\u3002\u66f4\u5927\u7684\u66f2\u76ee\u6587\u4ef6\u5939\u8bf7\u5206\u6279\u6dfb\u52a0\uff1b\u624b\u673a\u6d4f\u89c8\u5668\u82e5\u4e0d\u652f\u6301\u9009\u62e9\u6574\u4e2a\u6587\u4ef6\u5939\uff0c\u53ef\u4ee5\u6539\u9009\u591a\u4e2a\u6587\u4ef6\u3002\u003c/p>\n\u003ch4>\u4fee\u6539\u5df2\u6709\u66f2\u76ee\u003c/h4>\n\u003col>\n\u003cli>\u70b9\u51fb \u003cstrong>\u66f4\u65b0\u5df2\u6709\u66f2\u76ee\u003c/strong>\u3002\u003c/li>\n\u003cli>\u5728\u6807\u9898\u65c1\u70b9\u51fb\u300c\u66f4\u65b0\u5df2\u6709\u66f2\u76ee\u300d\uff0c\u641c\u7d22\u6574\u4e2a\u66f2\u5e93\u6216\u6309\u5b66\u671f\u7b5b\u9009\uff1b\u6eda\u52a8\u67e5\u770b\u7ed3\u679c\uff0c\u9009\u4e2d\u66f2\u76ee\u540e\u624d\u663e\u793a\u4fe1\u606f\u8868\u5355\uff0c\u5e76\u81ea\u52a8\u5e26\u5165\u539f\u5b66\u671f\u3002\u003c/li>\n\u003cli>\u4fee\u6539\u66f2\u540d\u3001\u7f16\u66f2\u8005\u3001\u6027\u8d28\u6216\u76ee\u6807\u5b66\u671f\uff1b\u4e5f\u53ef\u4ee5\u589e\u52a0\u65b0\u6587\u4ef6\u3001\u52fe\u9009\u8981\u5220\u9664\u7684\u65e7\u6587\u4ef6\u3002\u003c/li>\n\u003cli>\u70b9\u51fb\u4fdd\u5b58\uff1b\u53ea\u6709\u4fdd\u5b58\u540e\u4fee\u6539\u624d\u4f1a\u751f\u6548\u3002\u53d6\u6d88\u4fee\u6539\u4f1a\u9000\u51fa\u7f16\u8f91\u3002\u003c/li>\n\u003c/ol>\n\u003cp>\u7f16\u8f91\u5c5e\u4e8e\u5171\u4eab\u4e50\u8c31\u5e93\u64cd\u4f5c\uff0c\u4e0d\u53ea\u4fee\u6539\u4f60\u81ea\u5df1\u770b\u5230\u7684\u5185\u5bb9\u3002\u7cfb\u7edf\u76ee\u524d\u5141\u8bb8 Arranger \u7f16\u8f91\u5e93\u4e2d\u5df2\u6709\u66f2\u76ee\uff0c\u5e76\u672a\u9650\u5b9a\u53ea\u80fd\u7f16\u8f91\u672c\u4eba\u4e0a\u4f20\u7684\u66f2\u76ee\uff1b\u8bf7\u6309\u7167\u793e\u56e2\u7ea6\u5b9a\u64cd\u4f5c\u3002\u003c/p>", "en": "\u003ca id=\"quick-start\">\u003c/a>\n\u003ch2>Quick Start\u003c/h2>\n\u003cp>\u003cstrong>We recommend adding the website to your phone\u2019s home screen so you can open it like an app to browse scores and vote.\u003c/strong> No App Store download is needed.\u003c/p>\n\u003ca id=\"mobile\">\u003c/a>\n\u003ch3>On Your Phone: Add to Home Screen\u003c/h3>\n\u003col>\n\u003cli>Open \u003ca href=\"https://cucac-hub.vercel.app\">A Cappella Hub\u003c/a> in your phone\u2019s browser.\u003c/li>\n\u003cli>\u003cstrong>iPhone:\u003c/strong> Open in Safari or Chrome, choose \u003cstrong>Add to Home Screen\u003c/strong> from the share menu, then tap \u003cstrong>Add\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Other phones:\u003c/strong> Look for \u003cstrong>Add to Home Screen\u003c/strong> or an installation option in the browser menu. Availability and wording depend on the browser.\u003c/li>\n\u003cli>Open the \u003cstrong>CUCAC\u003c/strong> icon on your home screen and sign in.\u003c/li>\n\u003c/ol>\n\u003cp>This is a home screen shortcut to the website and requires an internet connection. If you already have an account, use it on both your phone and computer; no new registration is needed.\u003c/p>\n\u003ch3>Your First Visit\u003c/h3>\n\u003col>\n\u003cli>Open the \u003cstrong>CUCAC\u003c/strong> home screen icon or the website link above.\u003c/li>\n\u003cli>Tap \u003cstrong>\u7b2c\u4e00\u6b21\u6765\uff1f\u6ce8\u518c\u003c/strong> (\u201cFirst time? Register\u201d) to create an account with your name, or sign in if you already have one.\u003c/li>\n\u003cli>Fill in your information under \u003cstrong>My profile\u003c/strong>.\u003c/li>\n\u003cli>From the home page, open \u003cstrong>Members\u003c/strong>, \u003cstrong>Scores\u003c/strong>, or \u003cstrong>Solo voting\u003c/strong>.\u003c/li>\n\u003c/ol>\n\u003ca id=\"members\">\u003c/a>\n\u003ch2>Everyday Use\u003c/h2>\n\u003cp>\u003cstrong>Using your phone:\u003c/strong> Follow the \u003ca href=\"#mobile\">home screen setup steps\u003c/a> above. Then tap the \u003cstrong>CUCAC\u003c/strong> icon and sign in to browse scores, vote for solos, and update your profile.\u003c/p>\n\u003ca id=\"accounts\">\u003c/a>\n\u003ch3>Accounts and Sign-in\u003c/h3>\n\u003cul>\n\u003cli>Your \u003cstrong>name\u003c/strong> is your username, up to 20 characters. Choose a name other members will recognize. Usernames must be unique; capitalization does not distinguish English names.\u003c/li>\n\u003cli>Your \u003cstrong>password\u003c/strong> must be 4\u201372 characters. Use a password dedicated to this website.\u003c/li>\n\u003cli>Registration takes you directly to the home page. Use the same name and password to sign in on another device.\u003c/li>\n\u003cli>Your username and \u003cstrong>English full name\u003c/strong> are separate fields. Editing your full name does not change your username.\u003c/li>\n\u003cli>Select \u003cstrong>Log out\u003c/strong> after using a shared device.\u003c/li>\n\u003cli>Contact an administrator if you forget your password. There is no email password recovery; administrators can reset regular members\u2019 passwords.\u003c/li>\n\u003c/ul>\n\u003ca id=\"profile\">\u003c/a>\n\u003ch3>My Profile\u003c/h3>\n\u003cp>Open \u003cstrong>My profile\u003c/strong> from the home page. Fill in your English full name, pronouns, voice part, school, graduation year, major, fun fact, and favorite food, then save. Use a four-digit graduation year, such as \u003ccode>2027\u003c/code>.\u003c/p>\n\u003cp>Each profile has a \u003cstrong>Photo gallery\u003c/strong>. Any signed-in member can add photos of that person. Each photo must be under 5 MB; JPG, PNG, WebP, and GIF are supported. Click a photo to enlarge it and see who uploaded it.\u003c/p>\n\u003cul>\u003cli>The \u003cstrong>profile owner\u003c/strong> can delete any photo in their gallery and choose \u003cstrong>Set as avatar\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Uploaders\u003c/strong> can delete their own uploads. Other members cannot change the owner's avatar.\u003c/li>\u003cli>Deleting the photo used as the current avatar removes the avatar too; choose another photo afterward.\u003c/li>\u003cli>Existing avatars are automatically preserved when the gallery is first opened. Without an avatar, the first character of the member's name is shown.\u003c/li>\u003c/ul>\n\u003cp>Profiles and galleries are visible to other signed-in members. Share only information and photos you are comfortable sharing with the group.\u003c/p>\n\u003ca id=\"roster\">\u003c/a>\n\u003ch3>Members\u003c/h3>\n\u003cul>\n\u003cli>Members are grouped into \u003cstrong>Active\u003c/strong> and \u003cstrong>Alumni\u003c/strong>.\u003c/li>\n\u003cli>Select a member\u2019s name to view their profile.\u003c/li>\n\u003cli>Regular members can edit only their own profiles, not other members\u2019 roles or accounts.\u003c/li>\n\u003cli>Music Director, Arranger, and board position labels are assigned by an administrator or someone with the appropriate permission; you cannot assign them to yourself through your profile.\u003c/li>\n\u003c/ul>\n\u003ca id=\"voting\">\u003c/a>\u003ch3>Solo voting\u003c/h3>\u003cul>\u003cli>The MD creates a round and chooses Default voting (the default) or Like voting. Start voting shuffles existing candidates; later candidates appear at the end.\u003c/li>\u003cli>Default voting has one Vote button; click again to unselect. Two candidates at start: one choice per voter and registration/withdrawal are locked. Three or more: up to two choices and registration remains open. Contact the MD for withdrawal when only three remain, to avoid invalidating ballots.\u003c/li>\u003cli>Like voting keeps Sounds great and Not sure yet. Voting opens only after the MD starts it.\u003c/li>\u003cli>Results sort by Vote or Sounds great totals, with equal totals sharing a rank. Members see everyone tied at ranks 1 and 2, without counts. The MD can reveal additional ranks one at a time; only admin sees all ranks and counts.\u003c/li>\u003c/ul>\u003ca id=\"scores\">\u003c/a>\n\u003ch3>Browse Scores\u003c/h3>\n\u003col>\n\u003cli>Open \u003cstrong>Scores\u003c/strong> from the home page.\u003c/li>\n\u003cli>Choose a semester, such as \u003ccode>2026 Fall\u003c/code>, in the score browsing area.\u003c/li>\n\u003cli>Open a song folder or the semester folder link to view and download scores in Google Drive.\u003c/li>\n\u003c/ol>\n\u003cp>An administrator must configure the Google score library first. If the page says setup is incomplete, contact an administrator. Members do not need to configure Google Cloud themselves.\u003c/p>\n\u003cp>Your website account and Google account are separate. Drive files still follow Google Drive sharing permissions. If access is denied, check that you are signed in to the correct Google account and ask a club administrator for folder access.\u003c/p>\n\u003ca id=\"upload\">\u003c/a>\n\u003ch3>Upload and Edit Scores\u003c/h3>\n\u003cp>Only accounts assigned the \u003cstrong>Arranger\u003c/strong> role can upload and edit scores. Being a Music Director or holding another club position does not automatically grant upload permission.\u003c/p>\n\u003ch4>Upload a New Song\u003c/h4>\n\u003col>\n\u003cli>Open \u003cstrong>Scores\u003c/strong> and find the upload form.\u003c/li>\n\u003cli>Enter the song title.\u003c/li>\n\u003cli>Select one or more arrangers. If a name is missing, enter it and select \u003cstrong>Add\u003c/strong>.\u003c/li>\n\u003cli>Choose a semester.\u003c/li>\n\u003cli>Select \u003cstrong>All members\u003c/strong>, \u003cstrong>Small group\u003c/strong>, or both. At least one is required.\u003c/li>\n\u003cli>Select one or more files, or upload a folder using a browser that supports folder selection.\u003c/li>\n\u003cli>Select \u003cstrong>Upload\u003c/strong> and wait for the success message.\u003c/li>\n\u003c/ol>\n\u003cp>Files are stored under \u003ccode>Club root folder \u2192 Semester \u2192 Song title\u003c/code>, with a record added to the Google Sheets score index. Common formats include PDF, MuseScore \u003ccode>.mscz\u003c/code>, MusicXML \u003ccode>.musicxml\u003c/code> / \u003ccode>.xml\u003c/code> / \u003ccode>.mxl\u003c/code>, and images.\u003c/p>\n\u003cp>For the hosted version, \u003cstrong>all files in one upload must total less than 20 MB\u003c/strong>; the limit is not 20 MB per file. Add larger folders in batches. If your phone\u2019s browser cannot select a whole folder, select multiple files instead.\u003c/p>\n\u003ch4>Edit an Existing Song\u003c/h4>\n\u003col>\n\u003cli>Select \u003cstrong>\u66f4\u65b0\u5df2\u6709\u66f2\u76ee\u003c/strong> (\u201cUpdate an existing song\u201d).\u003c/li>\n\u003cli>Select Update an existing song beside the heading, then search the entire library or filter by semester. Scroll through the results and select a song to open its details; the original semester is filled in automatically.\u003c/li>\n\u003cli>Edit the title, arrangers, type, or destination semester. You can also add files and select existing files to delete.\u003c/li>\n\u003cli>Select \u003cstrong>Save\u003c/strong> to apply your changes. Canceling exits without saving.\u003c/li>\n\u003c/ol>\n\u003cp>Edits affect the shared library, not just your own view. Arrangers can currently edit existing songs in the library, including songs uploaded by others. Follow the club\u2019s agreed practices.\u003c/p>"};
