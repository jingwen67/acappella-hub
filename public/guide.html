const content={"zh": "<a id=\"quick-start\"></a>\n<h2>快速开始</h2>\n<p><strong>推荐大家先把网站添加到手机主屏幕，以后像打开 App 一样进入，查看乐谱和投票更方便。</strong> 无需去 App Store 下载。</p>\n<a id=\"mobile\"></a>\n<h3>在手机上使用：添加到主屏幕</h3>\n<ol>\n<li>用手机浏览器打开 <a href=\"https://cucac-hub.vercel.app\">A Cappella Hub</a>。</li>\n<li><strong>iPhone：</strong> 用 Safari 或 Chrome 打开，在分享菜单中选择 <strong>添加到主屏幕 / Add to Home Screen</strong>，再点击 <strong>添加 / Add</strong>。</li>\n<li><strong>其他手机：</strong> 在浏览器菜单中寻找 <strong>添加到主屏幕 / Add to Home Screen</strong> 或安装选项；是否显示及具体名称取决于浏览器。</li>\n<li>添加完成后，从手机主屏幕上的 <strong>CUCAC</strong> 图标打开，并登录自己的账号。</li>\n</ol>\n<p>这是网站的主屏幕入口，需要联网使用。已有账号不用重新注册，手机和电脑登录同一个账号即可。</p>\n<h3>第一次使用</h3>\n<ol>\n<li>从手机主屏幕的 <strong>CUCAC</strong> 图标进入，或打开上面的网站链接。</li>\n<li>第一次使用，点击 <strong>第一次来？注册</strong>，用自己的名字创建账号；已有账号则直接登录。</li>\n<li>在 <strong>我的资料 / My profile</strong> 补充个人信息。</li>\n<li>从主页进入 <strong>全体成员 / Members</strong>、<strong>查看/上传乐谱 / Scores</strong> 或 <strong>Solo / Duet 投票</strong>。</li>\n</ol>\n<a id=\"members\"></a>\n<h2>成员日常使用</h2>\n<p><strong>手机使用推荐：</strong> 先按上面的 <a href=\"#mobile\">添加到主屏幕步骤</a> 设置好入口。之后直接点击 <strong>CUCAC</strong> 图标，登录后就能查看乐谱、参加 Solo 投票和更新个人资料。</p>\n<a id=\"accounts\"></a>\n<h3>1. 注册、登录与账号</h3>\n<ul>\n<li><strong>名字</strong>是登录名：最多 20 个字符，建议使用其他成员能认出的名字。相同名字（不区分英文大小写）不能重复注册。</li>\n<li><strong>密码</strong>为 4–72 个字符；请使用自己专门为这个网站设置的密码。</li>\n<li>注册成功会直接进入主页。之后在另一台设备上，使用同一个名字和密码登录即可。</li>\n<li>登录名与资料里的 <strong>英文全名 / English full name</strong> 是两个字段：修改全名不会修改登录名。</li>\n<li>用完共享设备后，点击 <strong>退出 / Log out</strong>。</li>\n<li>忘记密码时，请联系管理员。当前没有邮件找回密码功能；管理员可以重设普通成员的密码。</li>\n</ul>\n<a id=\"profile\"></a>\n<h3>2. 我的资料</h3>\n<p>从主页进入 <strong>我的资料</strong>，填写英文全名、代词、声部、学校、毕业年份、专业、Fun fact 和喜欢的食物，再保存。毕业年份填写四位数字，例如 <code>2027</code>。</p>\n<p>个人资料页有 <strong>相册 / Photo gallery</strong>：所有登录成员都能给这个人上传照片。点击「上传照片」即可选文件、裁剪并确认上传。裁剪默认 <strong>1:1</strong>，也可以选择 <strong>自由裁剪 / Freeform</strong>，拖动选区或右下角调整大小；照片会转为静态 JPG。每张原图不超过 <strong>5 MB</strong>，超限时提示。</p><ul><li>相册以正方形网格显示，点击照片才显示大图和上传者名字。</li><li>点 <strong>♡ / ♥</strong> 点赞或取消点赞，每人每张计一次。</li><li>本人可在大图里 <strong>设为头像</strong> 或 <strong>取消设为头像</strong>，也可删除任何照片；上传者可删除自己上传的照片。</li><li>手动头像优先；未手动指定时，自动使用点赞最多且至少有一赞的照片，并列时使用较早上传的一张。删除手动头像或取消指定后自动回退；没有获赞照片时显示名字首字母。</li><li>原有头像保留为手动选择。相册没有设置张数上限，总量受存储空间限制；目前不支持视频。</li></ul><p>资料和相册对其他登录成员可见，请只填写或上传愿意与社团成员分享的内容。</p>\n<p>声部为单选，选项包括 Soprano、Alto、Tenor、Baritone、Bass、Bbox 和 Rap。在我的资料点 Edit，勾选声部后 Save。MD 可在其他成员资料的声部栏点 Edit，修改后 Save 生效。Active 名单在姓名旁显示声部，默认按声部排序，声部内部按名字首字母排序；Active 旁的小按钮可切换为按首字母排序，右侧下拉框可独立筛选声部。成员按资料声部排序，每人只显示一次。</p>\n<p>在声部选项下勾选 Crew / Media 并保存，会自动进入 Crew / Media 名单；取消勾选并保存后恢复原有成员分组。</p>\n<a id=\"roster\"></a>\n<h3>3. 全体成员</h3>\n<ul>\n<li>成员按 <strong>Active</strong> 和 <strong>Alumni</strong> 分组。</li>\n<li>点击成员名字可以查看其资料。</li>\n<li>普通成员只能修改自己的资料，不能修改其他人的角色或账号。</li>\n<li>Music Director、Arranger 和社团职位标签由管理员或有相应权限的人设置，不能在个人资料里自行获得。</li>\n</ul>\n<a id=\"song-plan\"></a><h3>这学期唱什么 · What Are We Singing?</h3><p>从主页进入 <strong>这学期唱什么</strong>，默认打开当前学期；顶部下拉框可查看历史学期。</p><ul><li>阵容表左边是<strong>歌名</strong>，上方依次是 <strong>Solo、Soprano、Alto、Tenor、Baritone、Bass、Bbox</strong>。每格可放多位成员；手机可横向滚动，歌曲列保持在左侧。</li><li>除 Solo 外，Active 成员可点格子里的 <strong>+ 报名</strong>，选择任意声部，不受 Profile 声部限制。同一首歌可兼任多个声部；点姓名旁的 <strong>×</strong> 只退出该声部。</li><li><strong>Solo 由 MD 安排</strong>，普通成员不能自行报名或移除 Solo。MD 可在各声部添加成员、移除报名，确认阵容后可锁定成员报名。</li><li><strong>添加 / 管理歌曲</strong>：可从曲库勾选、多选或全选；默认搜索整个曲库，也可按 Google Drive 学期文件夹查找，和更新已有乐谱的查找方式一致。</li><li>尚未上传乐谱的歌曲可以<strong>手动填写歌名</strong>，先安排阵容，页面显示「乐谱待上传」。后来选择曲库中的同名曲目会关联文件夹并保留报名。</li><li>MD 在<strong>学期设置</strong>中选择当前学期，或手动开启新学期；切换后其他学期自动归档，只读查看当时的人员与阵容。选歌和演出计划不再依赖乐谱学期文件夹中已有的歌曲。</li><li>点击 <strong>乐谱 ↗</strong> 打开对应文件夹。移除曲目只改变学期名单，不删除乐谱；重新加入保留已有报名。</li><li>Google Sheet 的 <strong>Semester</strong> 保留所有演出学期；旧歌加入新学期时追加新学期，不覆盖历史。Google 暂时失败时名单仍保存，可重试同步，并每日自动重试。</li></ul><p>大歌默认按资料声部填入 Active 成员。打开或刷新阵容时，新增且填写了声部的 Active 成员会自动补入；已有歌曲安排保持不变，不会被资料变化覆盖。Solo 和归档学期不受影响，取消大歌不清空阵容。</p><a id=\"voting\"></a>\n<h3>Solo / Duet 投票</h3>\n<p>发起轮次时，MD 可以选择四种方式：</p>\n<table><tr><td>方式</td><td>报名与投票</td></tr><tr><td>Solo · 默认投票</td><td>个人报名；两人场最多选一人，三人及以上最多选两人。</td></tr><tr><td>Solo · 点赞投票</td><td>个人报名；对每位参选人选择「好听 / 再听听」。</td></tr><tr><td>Duet · 组合投票（Pair Voting）</td><td>邀请搭档，对方确认后参选；两组最多选一组，三组及以上最多选两组。同一人可与不同搭档组成多组。</td></tr><tr><td>Duet · 分声部投票（Part Voting）</td><td>选择 Part A 或 Part B 报名，每人只报一个声部；两个声部分别投票、排名。每声部一至两人最多选一人，三人及以上最多选两人。</td></tr></table>\n<ol><li>进入 Solo / Duet 投票，查看曲目、编曲者和投票方式。</li><li>组合投票中，选择搭档并发出邀请；搭档登录后确认或婉拒。分声部投票中，选择要报名的声部。</li><li>等待 MD 点击 开始投票。此前已确认的参选人或组合随机排序，后来新增的排在末尾。</li><li>选择喜欢的参选人或组合，再次点击可取消；选择自动保存。轮次结束后不能修改。</li></ol>\n<p>MD 可以给分声部投票的两个声部设置名称，例如「高声部 / 低声部」。同一时间只进行一个轮次。组合投票至少需要两组已确认的搭档；分声部投票需要两个声部各至少一人才能开始。</p>\n<p>开始时只有两个 Solo 参选人或两个组合会锁定报名；分声部投票则对开始时一至两人的声部分别锁定。人数较多时可以继续报名。开始后若退出会使某组剩下少于三位，退出按钮会禁用，避免影响已经投出的选票。</p>\n<h4>结果与历史</h4>\n<p>结果按支持票排序，默认显示前两个名次，包含所有并列。Duet 组合按组合排名，分声部投票按 A、B 分别排名。MD 可继续揭晓后续名次，成员视图不显示汇总票数。最近最多显示 12 个已结束轮次。</p>\n<p>结果供 MD 与编曲者参考，系统不会自动确定演出人选。同一个人可能出现在多个获选组合中。</p>\n<p></p>\n<h4>录音与回听</h4><p>报名后，在自己的参选卡片中打开 <strong>录音 / 上传音频</strong>。允许麦克风权限，点 <strong>开始录音 → 停止并试听 → 保存录音</strong>；不满意可以重新录制，也可以上传已有音频。Duet 组合需先由搭档确认，两位搭档都可以添加或删除组合录音。</p><p>所有登录成员都可以播放保存的录音。录音不限制时长，单个文件最多 <strong>50 MB</strong>；投票进行中持续保留，结束后保留 <strong>7 天</strong>，可在历史轮次里回听，之后自动清理。投票结果继续保留。想长期留存，请在保存前下载自己的录音副本。</p>\n<a id=\"scores\"></a>\n<h3>5. 查看乐谱</h3>\n<ol>\n<li>从主页进入 <strong>查看/上传乐谱</strong>。</li>\n<li>在 <strong>查看乐谱</strong> 区域选择学期，例如 <code>2026 Fall</code>。</li>\n<li>点击 <strong>看 PDF / View PDF</strong>，在 Hub 内翻页、缩放或全屏看谱（PDF 右上角按钮或双击进入）。左右滑动可翻页，上下滑动在页顶或页底时翻页，需要时点 <strong>下载 / Download</strong>。原有链接仍可打开 Google Drive。</li>\n</ol>\n<p>Google 乐谱库需要管理员先配置。若页面提示尚未设置好，联系管理员即可，成员不需要自己配置 Google Cloud。</p>\n<p>网站账号与 Google 账号不是同一个系统。打开 Drive 文件仍受 Google Drive 的共享权限限制；若提示没有权限，确认登录了正确的 Google 账号，并向社团管理员申请该文件夹的访问权限。</p>\n<p>多个 PDF 时优先打开标星文件；未标星时暂用最近修改的 PDF。只有一个 PDF 时自动选中，也可在阅读器切换版本。没有 PDF 时请联系 MD；MD 可在「这学期唱什么」检查缺谱并补上传。</p><a id=\"upload\"></a>\n<h3>6. 上传与修改乐谱</h3>\n<p>只有被指定为 <strong>Arranger</strong> 的账号能上传和修改乐谱；仅拥有 Music Director 或其他社团职位，不会自动获得上传权限。</p>\n<h4>上传新曲目</h4>\n<ol>\n<li>进入 <strong>查看/上传乐谱</strong>，找到 <strong>上传乐谱</strong> 表单。</li>\n<li>填写曲名。</li>\n<li>选择编曲者，可以多选；名单没有相应名字时，输入名字并点击 <strong>添加</strong>。</li>\n<li>选择学期。</li>\n<li>勾选 <strong>大歌 / All members</strong>、<strong>小组 / Small group</strong>，至少选一项，也可以同时选两项。</li>\n<li>选择一个或多个文件，或使用支持文件夹选择的浏览器上传文件夹。</li>\n<li>点击 <strong>上传</strong>，等待成功提示。</li>\n</ol>\n<p>文件会放到 <code>社团大文件夹 → 学期 → 曲名</code> 下，同时在 Google Sheets 乐谱索引中添加记录。常见乐谱格式包括 PDF、MuseScore <code>.mscz</code>、MusicXML <code>.musicxml</code> / <code>.xml</code> / <code>.mxl</code> 和图片。</p>\n<p>线上版每次上传的<strong>所有文件合计需小于 4 MB</strong>，不是每个文件各有 20 MB。更大的曲目文件夹请分批添加；手机浏览器若不支持选择整个文件夹，可以改选多个文件。</p>\n<h4>修改已有曲目</h4>\n<ol>\n<li>点击 <strong>更新已有曲目</strong>。</li>\n<li>在标题旁点击「更新已有曲目」，搜索整个曲库，或按 Google Drive 学期文件夹筛选；滚动查看结果，选中曲目后才显示信息表单，自动填入 Sheet 中的曲名、编曲者、全部学期和性质。</li>\n<li>修改曲名、编曲者和性质，在可滚动的下拉多选菜单中选择全部演出学期；也可以增加新文件、勾选要删除的旧文件。</li>\n<li>点击保存；只有保存后修改才会生效。取消修改会退出编辑。</li>\n</ol>\n<p>编辑已有曲目的学期为可滚动的下拉多选菜单，按新到旧排列，收起时显示已选项，包含 Sheet 下拉选项和已有历史值。保存按勾选结果更新，不移动乐谱文件夹。新上传仍选择存放的学期目录。</p><p>编辑属于共享乐谱库操作，不只修改你自己看到的内容。系统目前允许 Arranger 编辑库中已有曲目，并未限定只能编辑本人上传的曲目；请按照社团约定操作。</p><p>勾选大歌会自动锁定报名，取消勾选恢复报名。发起 Solo 投票时可从当前学期选择歌曲；阵容表 Solo 栏的投票结果入口显示这首歌关联的历史排名。</p><p>发起关联歌曲的 Solo 投票时，名称框前会显示「歌名-」，只需输入本轮名称。历史投票修改名称或歌曲关联后，原有票数和排名保留。</p><p>更新已有曲目的文件列表中，点 ☆ 标记最新版 PDF，Hub 会优先打开。标星立即保存；新增 PDF 保存后可重新选择曲目并标星。只有一个 PDF 时自动选中。</p>", "en": "<a id=\"quick-start\"></a>\n<h2>Quick Start</h2>\n<p><strong>We recommend adding the website to your phone’s home screen so you can open it like an app to browse scores and vote.</strong> No App Store download is needed.</p>\n<a id=\"mobile\"></a>\n<h3>On Your Phone: Add to Home Screen</h3>\n<ol>\n<li>Open <a href=\"https://cucac-hub.vercel.app\">A Cappella Hub</a> in your phone’s browser.</li>\n<li><strong>iPhone:</strong> Open in Safari or Chrome, choose <strong>Add to Home Screen</strong> from the share menu, then tap <strong>Add</strong>.</li>\n<li><strong>Other phones:</strong> Look for <strong>Add to Home Screen</strong> or an installation option in the browser menu. Availability and wording depend on the browser.</li>\n<li>Open the <strong>CUCAC</strong> icon on your home screen and sign in.</li>\n</ol>\n<p>This is a home screen shortcut to the website and requires an internet connection. If you already have an account, use it on both your phone and computer; no new registration is needed.</p>\n<h3>Your First Visit</h3>\n<ol>\n<li>Open the <strong>CUCAC</strong> home screen icon or the website link above.</li>\n<li>Tap <strong>第一次来？注册</strong> (“First time? Register”) to create an account with your name, or sign in if you already have one.</li>\n<li>Fill in your information under <strong>My profile</strong>.</li>\n<li>From the home page, open <strong>Members</strong>, <strong>Scores</strong>, or <strong>Solo / Duet voting</strong>.</li>\n</ol>\n<a id=\"members\"></a>\n<h2>Everyday Use</h2>\n<p><strong>Using your phone:</strong> Follow the <a href=\"#mobile\">home screen setup steps</a> above. Then tap the <strong>CUCAC</strong> icon and sign in to browse scores, vote for solos, and update your profile.</p>\n<a id=\"accounts\"></a>\n<h3>Accounts and Sign-in</h3>\n<ul>\n<li>Your <strong>name</strong> is your username, up to 20 characters. Choose a name other members will recognize. Usernames must be unique; capitalization does not distinguish English names.</li>\n<li>Your <strong>password</strong> must be 4–72 characters. Use a password dedicated to this website.</li>\n<li>Registration takes you directly to the home page. Use the same name and password to sign in on another device.</li>\n<li>Your username and <strong>English full name</strong> are separate fields. Editing your full name does not change your username.</li>\n<li>Select <strong>Log out</strong> after using a shared device.</li>\n<li>Contact an administrator if you forget your password. There is no email password recovery; administrators can reset regular members’ passwords.</li>\n</ul>\n<a id=\"profile\"></a>\n<h3>My Profile</h3>\n<p>Open <strong>My profile</strong> from the home page. Fill in your English full name, pronouns, voice part, school, graduation year, major, fun fact, and favorite food, then save. Use a four-digit graduation year, such as <code>2027</code>.</p>\n<p>Each profile has a <strong>Photo gallery</strong>. Any signed-in member can add photos. Select Upload photo to choose a file, crop, and confirm upload: <strong>1:1</strong> is the default, or choose <strong>Freeform</strong> and drag the selection or its bottom-right corner. Photos are saved as still JPGs. Original images must be <strong>5 MB or smaller</strong>; oversized files show a warning.</p><ul><li>Photos appear in a square grid. Open a photo to see the full image and uploader name.</li><li>Select <strong>♡ / ♥</strong> to like or unlike a photo. Each member contributes one like per photo.</li><li>In the full preview, the owner can <strong>Set as avatar</strong>, switch back to <strong>Use automatic avatar</strong>, and delete any photo. Uploaders can delete their own photos.</li><li>A manually selected avatar takes priority. Otherwise, Hub uses the photo with the most likes, provided it has at least one; ties use the earlier upload. Canceling or deleting a manual avatar returns to automatic selection. With no liked photos, Hub shows the member's initial.</li><li>Existing avatars remain manually selected. There is no photo-count cap; total storage is limited. Video uploads are not supported.</li></ul><p>Profiles and galleries are visible to other signed-in members. Share only information and photos you are comfortable sharing with the group.</p>\n<p>Voice parts allow multiple selections: Soprano, Alto, Tenor, Baritone, Bass, Bbox, and Rap. Choose Edit in My profile, check your parts, then Save. The MD can click Edit in another member’s voice-part section and Save to apply changes. The Active list shows parts beside names and defaults to voice-part order, alphabetical within each part. The small button beside Active switches to alphabetical order; the right-hand dropdown independently filters by part. Members with multiple parts appear once, under their earliest selected part.</p>\n<p>Check Crew / Media below the voice parts and save to join the Crew / Media list. Uncheck and save to return to your previous member group.</p>\n<a id=\"roster\"></a>\n<h3>Members</h3>\n<ul>\n<li>Members are grouped into <strong>Active</strong> and <strong>Alumni</strong>.</li>\n<li>Select a member’s name to view their profile.</li>\n<li>Regular members can edit only their own profiles, not other members’ roles or accounts.</li>\n<li>Music Director, Arranger, and board position labels are assigned by an administrator or someone with the appropriate permission; you cannot assign them to yourself through your profile.</li>\n</ul>\n<a id=\"song-plan\"></a><h3>What Are We Singing?</h3><p>Open <strong>What Are We Singing?</strong> from the home page. It defaults to the current semester; use the dropdown to view archived semesters.</p><ul><li><strong>Songs</strong> appear down the left, with <strong>Solo, Soprano, Alto, Tenor, Baritone, Bass, Bbox</strong> across the top. Each cell can contain multiple singers. On phones, scroll horizontally while the song column stays visible.</li><li>Active members can select <strong>+ Join</strong> in any non-Solo cell, regardless of their profile voice parts. You may sing multiple parts in one song. <strong>×</strong> beside your name removes only that part.</li><li><strong>The MD assigns Solo singers</strong>; members cannot join or remove Solo themselves. The MD can add or remove singers in any part and confirm a lineup to lock member signup.</li><li><strong>Add / manage songs</strong> supports checking multiple library songs and selecting all results. Search the whole library by default, or browse a semester’s Google Drive folder, just like updating existing scores.</li><li>For scores not uploaded yet, <strong>enter the song title manually</strong> and begin arranging the lineup. It shows “Scores pending.” Selecting the same title from the library later links its folder while preserving signup.</li><li>In <strong>Semester settings</strong>, the MD can choose the current semester or start a new one. Switching archives the other semesters as read only, preserving their roster and lineup. The performance plan is managed independently of the contents of score-library semester folders.</li><li><strong>Scores ↗</strong> opens the linked folder. Removing a song from a semester keeps its scores and signup; re-adding restores them.</li><li>Google Sheet <strong>Semester</strong> retains every performance semester. Reusing a song appends the new semester without overwriting history. Google failures leave the list saved; sync can be retried and also retries daily.</li></ul><p>Select one voice part in your profile. Opening or refreshing a full-group lineup adds newly active singers who have a voice part and no existing assignment to their default part. Existing song assignments stay unchanged when profiles change. Solo and archived semesters are unaffected. Unchecking Full group keeps the lineup.</p><a id=\"voting\"></a>\n<h3>Solo / Duet Voting</h3>\n<p>The MD chooses one of four methods when opening a round:</p>\n<table><tr><td>Method</td><td>Registration and voting</td></tr><tr><td>Solo · Default Voting</td><td>Register individually. Choose one of two singers, or up to two of three or more.</td></tr><tr><td>Solo · Like Voting</td><td>Register individually. Give each singer “sounds great” or “not sure yet” feedback.</td></tr><tr><td>Duet · Pair Voting</td><td>Invite a partner; they must confirm before the pair joins. Choose one of two pairs, or up to two of three or more. A singer may join multiple pairs with different partners.</td></tr><tr><td>Duet · Part Voting</td><td>Register for Part A or Part B, one part per person. Vote and rank separately within each part: choose one of one or two singers, or up to two of three or more.</td></tr></table>\n<ol><li>Open Solo / Duet voting to see the song, arranger and voting method.</li><li>For Pair Voting, invite a partner, who can confirm or decline after signing in. For Part Voting, choose your part.</li><li>Wait for the MD to select Start voting. Confirmed entries are shuffled; later entries appear at the end.</li><li>Select your favorites and click again to unselect. Choices save automatically and cannot be changed after the round closes.</li></ol>\n<p>The MD can name the parts, such as “High voice / Low voice.” Only one round runs at a time. Pair Voting needs at least two confirmed pairs; Part Voting needs at least one singer in each part before voting starts.</p>\n<p>Starting with two soloists or two pairs locks registration. In Part Voting, each part starting with one or two singers locks separately. Larger groups allow later entries. After voting starts, withdrawal is disabled if it would leave fewer than three entries in a group, protecting existing ballots.</p>\n<h4>Results and History</h4>\n<p>Results rank by support votes. The first two ranks, including all ties, are initially shown. Pair Voting ranks pairs; Part Voting ranks A and B separately. The MD can reveal later ranks. Member views do not show aggregate counts. Up to 12 completed rounds appear in history.</p>\n<p>Results help the MD and arranger decide; the system does not automatically choose the performers. The same singer may appear in multiple leading pairs.</p>\n<p></p>\n<h4>Record and listen back</h4><p>After joining, open <strong>Record / upload audio</strong> on your own entry. Allow microphone access, then choose <strong>Record → Stop and preview → Save recording</strong>. You can record again or upload an existing audio file. Duet pairs must be confirmed first; either partner can add or delete recordings for their pair.</p><p>All signed-in members can play saved recordings. There is no recording time limit; each file can be up to <strong>50 MB</strong>. Recordings stay available while voting is open and for <strong>7 days after it closes</strong>, including in round history, before automatic cleanup. Voting results remain. To keep your recording longer, download your own copy before saving.</p>\n<a id=\"scores\"></a>\n<h3>Browse Scores</h3>\n<ol>\n<li>Open <strong>Scores</strong> from the home page.</li>\n<li>Choose a semester, such as <code>2026 Fall</code>, in the score browsing area.</li>\n<li>Select <strong>View PDF</strong> to read, turn pages, zoom, or enter fullscreen inside Hub using the PDF’s top-right button or a double-click. Swipe horizontally to turn pages; vertical swipes turn pages at the top or bottom of a page. Select <strong>Download</strong> for a copy. Existing folder links still open Google Drive.</li>\n</ol>\n<p>An administrator must configure the Google score library first. If the page says setup is incomplete, contact an administrator. Members do not need to configure Google Cloud themselves.</p>\n<p>Your website account and Google account are separate. Drive files still follow Google Drive sharing permissions. If access is denied, check that you are signed in to the correct Google account and ask a club administrator for folder access.</p>\n<p>Hub opens the starred PDF first, or the most recently modified PDF if none is starred. A single PDF is selected automatically. Switch versions in the reader. If a PDF is missing, contact your MD; MDs can check and add current-semester PDFs in What Are We Singing?</p><a id=\"upload\"></a>\n<h3>Upload and Edit Scores</h3>\n<p>Only accounts assigned the <strong>Arranger</strong> role can upload and edit scores. Being a Music Director or holding another club position does not automatically grant upload permission.</p>\n<h4>Upload a New Song</h4>\n<ol>\n<li>Open <strong>Scores</strong> and find the upload form.</li>\n<li>Enter the song title.</li>\n<li>Select one or more arrangers. If a name is missing, enter it and select <strong>Add</strong>.</li>\n<li>Choose a semester.</li>\n<li>Select <strong>All members</strong>, <strong>Small group</strong>, or both. At least one is required.</li>\n<li>Select one or more files, or upload a folder using a browser that supports folder selection.</li>\n<li>Select <strong>Upload</strong> and wait for the success message.</li>\n</ol>\n<p>Files are stored under <code>Club root folder → Semester → Song title</code>, with a record added to the Google Sheets score index. Common formats include PDF, MuseScore <code>.mscz</code>, MusicXML <code>.musicxml</code> / <code>.xml</code> / <code>.mxl</code>, and images.</p>\n<p>For the hosted version, <strong>all files in one upload must total less than 4 MB</strong>; the limit is not 20 MB per file. Add larger folders in batches. If your phone’s browser cannot select a whole folder, select multiple files instead.</p>\n<h4>Edit an Existing Song</h4>\n<ol>\n<li>Select <strong>更新已有曲目</strong> (“Update an existing song”).</li>\n<li>Select Update an existing song beside the heading, then search the entire library or browse a semester’s Google Drive folder. Scroll through the results and select a song to open its details; the existing title, arrangers, all semesters, and song types are filled in from Google Sheet.</li>\n<li>Edit the title, arrangers, type, or selected performance semesters. You can also add files and select existing files to delete.</li>\n<li>Select <strong>Save</strong> to apply your changes. Canceling exits without saving.</li>\n</ol>\n<p>When editing an existing song, select performance semesters in the scrollable dropdown, ordered newest first. Selected semesters remain visible when it is closed. Saving updates those semesters without moving the Drive score folder. New uploads still choose a destination semester. Edits affect the shared library, not just your own view. Arrangers can currently edit existing songs in the library, including songs uploaded by others. Follow the club’s agreed practices.</p><p>Full group locks signup automatically; unchecking reopens signup. Select a current-semester song when creating a Solo poll. Voting results in its Solo cell opens linked historical rankings.</p><p>When linking a Solo poll to a song, its title field shows “Song-” before the input. Enter only the round name. Updating a past poll’s name or linked song preserves its votes and rankings.</p><p>In the existing-song file list, select ☆ to mark the latest PDF Hub should open by default. Stars save immediately. After saving newly added PDFs, select the song again to star one. A single PDF is selected automatically.</p>"};
