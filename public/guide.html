const content={"zh": "<a id=\"quick-start\"></a>\n<h2>\u5feb\u901f\u5f00\u59cb</h2>\n<p><strong>\u63a8\u8350\u5927\u5bb6\u5148\u628a\u7f51\u7ad9\u6dfb\u52a0\u5230\u624b\u673a\u4e3b\u5c4f\u5e55\uff0c\u4ee5\u540e\u50cf\u6253\u5f00 App \u4e00\u6837\u8fdb\u5165\uff0c\u67e5\u770b\u4e50\u8c31\u548c\u6295\u7968\u66f4\u65b9\u4fbf\u3002</strong> \u65e0\u9700\u53bb App Store \u4e0b\u8f7d\u3002</p>\n<a id=\"mobile\"></a>\n<h3>\u5728\u624b\u673a\u4e0a\u4f7f\u7528\uff1a\u6dfb\u52a0\u5230\u4e3b\u5c4f\u5e55</h3>\n<ol>\n<li>\u7528\u624b\u673a\u6d4f\u89c8\u5668\u6253\u5f00 <a href=\"https://cucac-hub.vercel.app\">A Cappella Hub</a>\u3002</li>\n<li><strong>iPhone\uff1a</strong> \u7528 Safari \u6216 Chrome \u6253\u5f00\uff0c\u5728\u5206\u4eab\u83dc\u5355\u4e2d\u9009\u62e9 <strong>\u6dfb\u52a0\u5230\u4e3b\u5c4f\u5e55 / Add to Home Screen</strong>\uff0c\u518d\u70b9\u51fb <strong>\u6dfb\u52a0 / Add</strong>\u3002</li>\n<li><strong>\u5176\u4ed6\u624b\u673a\uff1a</strong> \u5728\u6d4f\u89c8\u5668\u83dc\u5355\u4e2d\u5bfb\u627e <strong>\u6dfb\u52a0\u5230\u4e3b\u5c4f\u5e55 / Add to Home Screen</strong> \u6216\u5b89\u88c5\u9009\u9879\uff1b\u662f\u5426\u663e\u793a\u53ca\u5177\u4f53\u540d\u79f0\u53d6\u51b3\u4e8e\u6d4f\u89c8\u5668\u3002</li>\n<li>\u6dfb\u52a0\u5b8c\u6210\u540e\uff0c\u4ece\u624b\u673a\u4e3b\u5c4f\u5e55\u4e0a\u7684 <strong>CUCAC</strong> \u56fe\u6807\u6253\u5f00\uff0c\u5e76\u767b\u5f55\u81ea\u5df1\u7684\u8d26\u53f7\u3002</li>\n</ol>\n<p>\u8fd9\u662f\u7f51\u7ad9\u7684\u4e3b\u5c4f\u5e55\u5165\u53e3\uff0c\u9700\u8981\u8054\u7f51\u4f7f\u7528\u3002\u5df2\u6709\u8d26\u53f7\u4e0d\u7528\u91cd\u65b0\u6ce8\u518c\uff0c\u624b\u673a\u548c\u7535\u8111\u767b\u5f55\u540c\u4e00\u4e2a\u8d26\u53f7\u5373\u53ef\u3002</p>\n<h3>\u7b2c\u4e00\u6b21\u4f7f\u7528</h3>\n<ol>\n<li>\u4ece\u624b\u673a\u4e3b\u5c4f\u5e55\u7684 <strong>CUCAC</strong> \u56fe\u6807\u8fdb\u5165\uff0c\u6216\u6253\u5f00\u4e0a\u9762\u7684\u7f51\u7ad9\u94fe\u63a5\u3002</li>\n<li>\u7b2c\u4e00\u6b21\u4f7f\u7528\uff0c\u70b9\u51fb <strong>\u7b2c\u4e00\u6b21\u6765\uff1f\u6ce8\u518c</strong>\uff0c\u7528\u81ea\u5df1\u7684\u540d\u5b57\u521b\u5efa\u8d26\u53f7\uff1b\u5df2\u6709\u8d26\u53f7\u5219\u76f4\u63a5\u767b\u5f55\u3002</li>\n<li>\u5728 <strong>\u6211\u7684\u8d44\u6599 / My profile</strong> \u8865\u5145\u4e2a\u4eba\u4fe1\u606f\u3002</li>\n<li>\u4ece\u4e3b\u9875\u8fdb\u5165 <strong>\u5168\u4f53\u6210\u5458 / Members</strong>\u3001<strong>\u67e5\u770b/\u4e0a\u4f20\u4e50\u8c31 / Scores</strong> \u6216 <strong>Solo / Duet \u6295\u7968</strong>\u3002</li>\n</ol>\n<a id=\"members\"></a>\n<h2>\u6210\u5458\u65e5\u5e38\u4f7f\u7528</h2>\n<p><strong>\u624b\u673a\u4f7f\u7528\u63a8\u8350\uff1a</strong> \u5148\u6309\u4e0a\u9762\u7684 <a href=\"#mobile\">\u6dfb\u52a0\u5230\u4e3b\u5c4f\u5e55\u6b65\u9aa4</a> \u8bbe\u7f6e\u597d\u5165\u53e3\u3002\u4e4b\u540e\u76f4\u63a5\u70b9\u51fb <strong>CUCAC</strong> \u56fe\u6807\uff0c\u767b\u5f55\u540e\u5c31\u80fd\u67e5\u770b\u4e50\u8c31\u3001\u53c2\u52a0 Solo \u6295\u7968\u548c\u66f4\u65b0\u4e2a\u4eba\u8d44\u6599\u3002</p>\n<a id=\"accounts\"></a>\n<h3>1. \u6ce8\u518c\u3001\u767b\u5f55\u4e0e\u8d26\u53f7</h3>\n<ul>\n<li><strong>\u540d\u5b57</strong>\u662f\u767b\u5f55\u540d\uff1a\u6700\u591a 20 \u4e2a\u5b57\u7b26\uff0c\u5efa\u8bae\u4f7f\u7528\u5176\u4ed6\u6210\u5458\u80fd\u8ba4\u51fa\u7684\u540d\u5b57\u3002\u76f8\u540c\u540d\u5b57\uff08\u4e0d\u533a\u5206\u82f1\u6587\u5927\u5c0f\u5199\uff09\u4e0d\u80fd\u91cd\u590d\u6ce8\u518c\u3002</li>\n<li><strong>\u5bc6\u7801</strong>\u4e3a 4\u201372 \u4e2a\u5b57\u7b26\uff1b\u8bf7\u4f7f\u7528\u81ea\u5df1\u4e13\u95e8\u4e3a\u8fd9\u4e2a\u7f51\u7ad9\u8bbe\u7f6e\u7684\u5bc6\u7801\u3002</li>\n<li>\u6ce8\u518c\u6210\u529f\u4f1a\u76f4\u63a5\u8fdb\u5165\u4e3b\u9875\u3002\u4e4b\u540e\u5728\u53e6\u4e00\u53f0\u8bbe\u5907\u4e0a\uff0c\u4f7f\u7528\u540c\u4e00\u4e2a\u540d\u5b57\u548c\u5bc6\u7801\u767b\u5f55\u5373\u53ef\u3002</li>\n<li>\u767b\u5f55\u540d\u4e0e\u8d44\u6599\u91cc\u7684 <strong>\u82f1\u6587\u5168\u540d / English full name</strong> \u662f\u4e24\u4e2a\u5b57\u6bb5\uff1a\u4fee\u6539\u5168\u540d\u4e0d\u4f1a\u4fee\u6539\u767b\u5f55\u540d\u3002</li>\n<li>\u7528\u5b8c\u5171\u4eab\u8bbe\u5907\u540e\uff0c\u70b9\u51fb <strong>\u9000\u51fa / Log out</strong>\u3002</li>\n<li>\u5fd8\u8bb0\u5bc6\u7801\u65f6\uff0c\u8bf7\u8054\u7cfb\u7ba1\u7406\u5458\u3002\u5f53\u524d\u6ca1\u6709\u90ae\u4ef6\u627e\u56de\u5bc6\u7801\u529f\u80fd\uff1b\u7ba1\u7406\u5458\u53ef\u4ee5\u91cd\u8bbe\u666e\u901a\u6210\u5458\u7684\u5bc6\u7801\u3002</li>\n</ul>\n<a id=\"profile\"></a>\n<h3>2. \u6211\u7684\u8d44\u6599</h3>\n<p>\u4ece\u4e3b\u9875\u8fdb\u5165 <strong>\u6211\u7684\u8d44\u6599</strong>\uff0c\u586b\u5199\u82f1\u6587\u5168\u540d\u3001\u4ee3\u8bcd\u3001\u58f0\u90e8\u3001\u5b66\u6821\u3001\u6bd5\u4e1a\u5e74\u4efd\u3001\u4e13\u4e1a\u3001Fun fact \u548c\u559c\u6b22\u7684\u98df\u7269\uff0c\u518d\u4fdd\u5b58\u3002\u6bd5\u4e1a\u5e74\u4efd\u586b\u5199\u56db\u4f4d\u6570\u5b57\uff0c\u4f8b\u5982 <code>2027</code>\u3002</p>\n<p>\u4e2a\u4eba\u8d44\u6599\u9875\u6709 <strong>\u76f8\u518c / Photo gallery</strong>\uff1a\u6240\u6709\u767b\u5f55\u6210\u5458\u90fd\u80fd\u7ed9\u8fd9\u4e2a\u4eba\u4e0a\u4f20\u7167\u7247\uff0c\u6bcf\u5f20\u9700\u5c0f\u4e8e 5 MB\uff0c\u652f\u6301 JPG\u3001PNG\u3001WebP \u548c GIF\u3002\u70b9\u51fb\u7167\u7247\u53ef\u653e\u5927\uff0c\u5e76\u663e\u793a\u4e0a\u4f20\u8005\u540d\u5b57\u3002</p>\n<ul><li><strong>\u672c\u4eba</strong>\u53ef\u4ee5\u5220\u9664\u76f8\u518c\u4e2d\u7684\u4efb\u4f55\u7167\u7247\uff0c\u5e76\u70b9\u51fb <strong>\u8bbe\u4e3a\u5934\u50cf / Set as avatar</strong> \u9009\u62e9\u5934\u50cf\u3002</li><li><strong>\u4e0a\u4f20\u8005</strong>\u53ef\u4ee5\u5220\u9664\u81ea\u5df1\u4e0a\u4f20\u7684\u7167\u7247\uff1b\u5176\u4ed6\u6210\u5458\u4e0d\u80fd\u66ff\u672c\u4eba\u66f4\u6362\u5934\u50cf\u3002</li><li>\u5220\u9664\u5f53\u524d\u5934\u50cf\u5bf9\u5e94\u7684\u7167\u7247\u65f6\uff0c\u5934\u50cf\u4e5f\u4f1a\u79fb\u9664\uff0c\u53ef\u91cd\u65b0\u9009\u62e9\u53e6\u4e00\u5f20\u3002</li><li>\u539f\u6709\u5934\u50cf\u4f1a\u5728\u9996\u6b21\u6253\u5f00\u76f8\u518c\u65f6\u81ea\u52a8\u4fdd\u7559\u3002\u6ca1\u6709\u7167\u7247\u65f6\u663e\u793a\u540d\u5b57\u9996\u5b57\u3002</li></ul>\n<p>\u8d44\u6599\u548c\u76f8\u518c\u5bf9\u5176\u4ed6\u767b\u5f55\u6210\u5458\u53ef\u89c1\uff0c\u8bf7\u53ea\u586b\u5199\u6216\u4e0a\u4f20\u613f\u610f\u4e0e\u793e\u56e2\u6210\u5458\u5206\u4eab\u7684\u5185\u5bb9\u3002</p>\n<p>\u58f0\u90e8\u652f\u6301\u591a\u9009 Soprano\u3001Alto\u3001Tenor\u3001Baritone\u3001Bass\u3001Bbox \u548c Rap\u3002\u5728\u6211\u7684\u8d44\u6599\u70b9 Edit\uff0c\u52fe\u9009\u58f0\u90e8\u540e Save\u3002MD \u53ef\u5728\u5176\u4ed6\u6210\u5458\u8d44\u6599\u7684\u58f0\u90e8\u680f\u70b9 Edit\uff0c\u4fee\u6539\u540e Save \u751f\u6548\u3002Active \u540d\u5355\u5728\u59d3\u540d\u65c1\u663e\u793a\u58f0\u90e8\uff0c\u9ed8\u8ba4\u6309\u58f0\u90e8\u6392\u5e8f\uff0c\u58f0\u90e8\u5185\u90e8\u6309\u540d\u5b57\u9996\u5b57\u6bcd\u6392\u5e8f\uff1bActive \u65c1\u7684\u5c0f\u6309\u94ae\u53ef\u5207\u6362\u4e3a\u6309\u9996\u5b57\u6bcd\u6392\u5e8f\uff0c\u53f3\u4fa7\u4e0b\u62c9\u6846\u53ef\u72ec\u7acb\u7b5b\u9009\u58f0\u90e8\u3002\u517c\u4efb\u591a\u4e2a\u58f0\u90e8\u7684\u6210\u5458\u6309\u6240\u9009\u58f0\u90e8\u4e2d\u6700\u9760\u524d\u7684\u58f0\u90e8\u6392\u5e8f\uff0c\u6bcf\u4eba\u53ea\u663e\u793a\u4e00\u6b21\u3002</p>\n<p>\u5728\u58f0\u90e8\u9009\u9879\u4e0b\u52fe\u9009 Crew / Media \u5e76\u4fdd\u5b58\uff0c\u4f1a\u81ea\u52a8\u8fdb\u5165 Crew / Media \u540d\u5355\uff1b\u53d6\u6d88\u52fe\u9009\u5e76\u4fdd\u5b58\u540e\u6062\u590d\u539f\u6709\u6210\u5458\u5206\u7ec4\u3002</p>\n<a id=\"roster\"></a>\n<h3>3. \u5168\u4f53\u6210\u5458</h3>\n<ul>\n<li>\u6210\u5458\u6309 <strong>Active</strong> \u548c <strong>Alumni</strong> \u5206\u7ec4\u3002</li>\n<li>\u70b9\u51fb\u6210\u5458\u540d\u5b57\u53ef\u4ee5\u67e5\u770b\u5176\u8d44\u6599\u3002</li>\n<li>\u666e\u901a\u6210\u5458\u53ea\u80fd\u4fee\u6539\u81ea\u5df1\u7684\u8d44\u6599\uff0c\u4e0d\u80fd\u4fee\u6539\u5176\u4ed6\u4eba\u7684\u89d2\u8272\u6216\u8d26\u53f7\u3002</li>\n<li>Music Director\u3001Arranger \u548c\u793e\u56e2\u804c\u4f4d\u6807\u7b7e\u7531\u7ba1\u7406\u5458\u6216\u6709\u76f8\u5e94\u6743\u9650\u7684\u4eba\u8bbe\u7f6e\uff0c\u4e0d\u80fd\u5728\u4e2a\u4eba\u8d44\u6599\u91cc\u81ea\u884c\u83b7\u5f97\u3002</li>\n</ul>\n<a id=\"song-plan\"></a><h3>\u8fd9\u5b66\u671f\u5531\u4ec0\u4e48 \u00b7 What Are We Singing?</h3><p>\u4ece\u4e3b\u9875\u8fdb\u5165 <strong>\u8fd9\u5b66\u671f\u5531\u4ec0\u4e48</strong>\uff0c\u9ed8\u8ba4\u6253\u5f00\u5f53\u524d\u5b66\u671f\uff1b\u9876\u90e8\u4e0b\u62c9\u6846\u53ef\u67e5\u770b\u5386\u53f2\u5b66\u671f\u3002</p><ul><li>\u9635\u5bb9\u8868\u5de6\u8fb9\u662f<strong>\u6b4c\u540d</strong>\uff0c\u4e0a\u65b9\u4f9d\u6b21\u662f <strong>Solo\u3001Soprano\u3001Alto\u3001Tenor\u3001Baritone\u3001Bass\u3001Bbox</strong>\u3002\u6bcf\u683c\u53ef\u653e\u591a\u4f4d\u6210\u5458\uff1b\u624b\u673a\u53ef\u6a2a\u5411\u6eda\u52a8\uff0c\u6b4c\u66f2\u5217\u4fdd\u6301\u5728\u5de6\u4fa7\u3002</li><li>\u9664 Solo \u5916\uff0cActive \u6210\u5458\u53ef\u70b9\u683c\u5b50\u91cc\u7684 <strong>+ \u62a5\u540d</strong>\uff0c\u9009\u62e9\u4efb\u610f\u58f0\u90e8\uff0c\u4e0d\u53d7 Profile \u58f0\u90e8\u9650\u5236\u3002\u540c\u4e00\u9996\u6b4c\u53ef\u517c\u4efb\u591a\u4e2a\u58f0\u90e8\uff1b\u70b9\u59d3\u540d\u65c1\u7684 <strong>\u00d7</strong> \u53ea\u9000\u51fa\u8be5\u58f0\u90e8\u3002</li><li><strong>Solo \u7531 MD \u5b89\u6392</strong>\uff0c\u666e\u901a\u6210\u5458\u4e0d\u80fd\u81ea\u884c\u62a5\u540d\u6216\u79fb\u9664 Solo\u3002MD \u53ef\u5728\u5404\u58f0\u90e8\u6dfb\u52a0\u6210\u5458\u3001\u79fb\u9664\u62a5\u540d\uff0c\u786e\u8ba4\u9635\u5bb9\u540e\u53ef\u9501\u5b9a\u6210\u5458\u62a5\u540d\u3002</li><li><strong>\u6dfb\u52a0 / \u7ba1\u7406\u6b4c\u66f2</strong>\uff1a\u53ef\u4ece\u66f2\u5e93\u52fe\u9009\u3001\u591a\u9009\u6216\u5168\u9009\uff1b\u9ed8\u8ba4\u641c\u7d22\u6574\u4e2a\u66f2\u5e93\uff0c\u4e5f\u53ef\u6309 Google Drive \u5b66\u671f\u6587\u4ef6\u5939\u67e5\u627e\uff0c\u548c\u66f4\u65b0\u5df2\u6709\u4e50\u8c31\u7684\u67e5\u627e\u65b9\u5f0f\u4e00\u81f4\u3002</li><li>\u5c1a\u672a\u4e0a\u4f20\u4e50\u8c31\u7684\u6b4c\u66f2\u53ef\u4ee5<strong>\u624b\u52a8\u586b\u5199\u6b4c\u540d</strong>\uff0c\u5148\u5b89\u6392\u9635\u5bb9\uff0c\u9875\u9762\u663e\u793a\u300c\u4e50\u8c31\u5f85\u4e0a\u4f20\u300d\u3002\u540e\u6765\u9009\u62e9\u66f2\u5e93\u4e2d\u7684\u540c\u540d\u66f2\u76ee\u4f1a\u5173\u8054\u6587\u4ef6\u5939\u5e76\u4fdd\u7559\u62a5\u540d\u3002</li><li>MD \u5728<strong>\u5b66\u671f\u8bbe\u7f6e</strong>\u4e2d\u9009\u62e9\u5f53\u524d\u5b66\u671f\uff0c\u6216\u624b\u52a8\u5f00\u542f\u65b0\u5b66\u671f\uff1b\u5207\u6362\u540e\u5176\u4ed6\u5b66\u671f\u81ea\u52a8\u5f52\u6863\uff0c\u53ea\u8bfb\u67e5\u770b\u5f53\u65f6\u7684\u4eba\u5458\u4e0e\u9635\u5bb9\u3002\u9009\u6b4c\u548c\u6f14\u51fa\u8ba1\u5212\u4e0d\u518d\u4f9d\u8d56\u4e50\u8c31\u5b66\u671f\u6587\u4ef6\u5939\u4e2d\u5df2\u6709\u7684\u6b4c\u66f2\u3002</li><li>\u70b9\u51fb <strong>\u4e50\u8c31 \u2197</strong> \u6253\u5f00\u5bf9\u5e94\u6587\u4ef6\u5939\u3002\u79fb\u9664\u66f2\u76ee\u53ea\u6539\u53d8\u5b66\u671f\u540d\u5355\uff0c\u4e0d\u5220\u9664\u4e50\u8c31\uff1b\u91cd\u65b0\u52a0\u5165\u4fdd\u7559\u5df2\u6709\u62a5\u540d\u3002</li><li>Google Sheet \u7684 <strong>Semester</strong> \u4fdd\u7559\u6240\u6709\u6f14\u51fa\u5b66\u671f\uff1b\u65e7\u6b4c\u52a0\u5165\u65b0\u5b66\u671f\u65f6\u8ffd\u52a0\u65b0\u5b66\u671f\uff0c\u4e0d\u8986\u76d6\u5386\u53f2\u3002Google \u6682\u65f6\u5931\u8d25\u65f6\u540d\u5355\u4ecd\u4fdd\u5b58\uff0c\u53ef\u91cd\u8bd5\u540c\u6b65\uff0c\u5e76\u6bcf\u65e5\u81ea\u52a8\u91cd\u8bd5\u3002</li></ul><p>\u52fe\u9009\u6b4c\u66f2\u65c1\u7684\u300c\u5927\u6b4c\u300d\uff0c\u6309 Profile \u58f0\u90e8\u81ea\u52a8\u586b\u5165\u6240\u6709\u6709\u5bf9\u5e94\u58f0\u90e8\u7684 Active \u6210\u5458\uff0c\u517c\u4efb\u58f0\u90e8\u4f1a\u586b\u5165\u591a\u4e2a\u683c\u5b50\u3002Solo \u548c\u5df2\u6709\u5b89\u6392\u4fdd\u7559\uff0c\u53d6\u6d88\u52fe\u9009\u4e0d\u6e05\u7a7a\u9635\u5bb9\u3002</p><a id=\"voting\"></a>\n<h3>Solo / Duet \u6295\u7968</h3>\n<p>\u53d1\u8d77\u8f6e\u6b21\u65f6\uff0cMD \u53ef\u4ee5\u9009\u62e9\u56db\u79cd\u65b9\u5f0f\uff1a</p>\n<table><tr><td>\u65b9\u5f0f</td><td>\u62a5\u540d\u4e0e\u6295\u7968</td></tr><tr><td>Solo \u00b7 \u9ed8\u8ba4\u6295\u7968</td><td>\u4e2a\u4eba\u62a5\u540d\uff1b\u4e24\u4eba\u573a\u6700\u591a\u9009\u4e00\u4eba\uff0c\u4e09\u4eba\u53ca\u4ee5\u4e0a\u6700\u591a\u9009\u4e24\u4eba\u3002</td></tr><tr><td>Solo \u00b7 \u70b9\u8d5e\u6295\u7968</td><td>\u4e2a\u4eba\u62a5\u540d\uff1b\u5bf9\u6bcf\u4f4d\u53c2\u9009\u4eba\u9009\u62e9\u300c\u597d\u542c / \u518d\u542c\u542c\u300d\u3002</td></tr><tr><td>Duet \u00b7 \u7ec4\u5408\u6295\u7968\uff08Pair Voting\uff09</td><td>\u9080\u8bf7\u642d\u6863\uff0c\u5bf9\u65b9\u786e\u8ba4\u540e\u53c2\u9009\uff1b\u4e24\u7ec4\u6700\u591a\u9009\u4e00\u7ec4\uff0c\u4e09\u7ec4\u53ca\u4ee5\u4e0a\u6700\u591a\u9009\u4e24\u7ec4\u3002\u540c\u4e00\u4eba\u53ef\u4e0e\u4e0d\u540c\u642d\u6863\u7ec4\u6210\u591a\u7ec4\u3002</td></tr><tr><td>Duet \u00b7 \u5206\u58f0\u90e8\u6295\u7968\uff08Part Voting\uff09</td><td>\u9009\u62e9 Part A \u6216 Part B \u62a5\u540d\uff0c\u6bcf\u4eba\u53ea\u62a5\u4e00\u4e2a\u58f0\u90e8\uff1b\u4e24\u4e2a\u58f0\u90e8\u5206\u522b\u6295\u7968\u3001\u6392\u540d\u3002\u6bcf\u58f0\u90e8\u4e00\u81f3\u4e24\u4eba\u6700\u591a\u9009\u4e00\u4eba\uff0c\u4e09\u4eba\u53ca\u4ee5\u4e0a\u6700\u591a\u9009\u4e24\u4eba\u3002</td></tr></table>\n<ol><li>\u8fdb\u5165 Solo / Duet \u6295\u7968\uff0c\u67e5\u770b\u66f2\u76ee\u3001\u7f16\u66f2\u8005\u548c\u6295\u7968\u65b9\u5f0f\u3002</li><li>\u7ec4\u5408\u6295\u7968\u4e2d\uff0c\u9009\u62e9\u642d\u6863\u5e76\u53d1\u51fa\u9080\u8bf7\uff1b\u642d\u6863\u767b\u5f55\u540e\u786e\u8ba4\u6216\u5a49\u62d2\u3002\u5206\u58f0\u90e8\u6295\u7968\u4e2d\uff0c\u9009\u62e9\u8981\u62a5\u540d\u7684\u58f0\u90e8\u3002</li><li>\u7b49\u5f85 MD \u70b9\u51fb \u5f00\u59cb\u6295\u7968\u3002\u6b64\u524d\u5df2\u786e\u8ba4\u7684\u53c2\u9009\u4eba\u6216\u7ec4\u5408\u968f\u673a\u6392\u5e8f\uff0c\u540e\u6765\u65b0\u589e\u7684\u6392\u5728\u672b\u5c3e\u3002</li><li>\u9009\u62e9\u559c\u6b22\u7684\u53c2\u9009\u4eba\u6216\u7ec4\u5408\uff0c\u518d\u6b21\u70b9\u51fb\u53ef\u53d6\u6d88\uff1b\u9009\u62e9\u81ea\u52a8\u4fdd\u5b58\u3002\u8f6e\u6b21\u7ed3\u675f\u540e\u4e0d\u80fd\u4fee\u6539\u3002</li></ol>\n<p>MD \u53ef\u4ee5\u7ed9\u5206\u58f0\u90e8\u6295\u7968\u7684\u4e24\u4e2a\u58f0\u90e8\u8bbe\u7f6e\u540d\u79f0\uff0c\u4f8b\u5982\u300c\u9ad8\u58f0\u90e8 / \u4f4e\u58f0\u90e8\u300d\u3002\u540c\u4e00\u65f6\u95f4\u53ea\u8fdb\u884c\u4e00\u4e2a\u8f6e\u6b21\u3002\u7ec4\u5408\u6295\u7968\u81f3\u5c11\u9700\u8981\u4e24\u7ec4\u5df2\u786e\u8ba4\u7684\u642d\u6863\uff1b\u5206\u58f0\u90e8\u6295\u7968\u9700\u8981\u4e24\u4e2a\u58f0\u90e8\u5404\u81f3\u5c11\u4e00\u4eba\u624d\u80fd\u5f00\u59cb\u3002</p>\n<p>\u5f00\u59cb\u65f6\u53ea\u6709\u4e24\u4e2a Solo \u53c2\u9009\u4eba\u6216\u4e24\u4e2a\u7ec4\u5408\u4f1a\u9501\u5b9a\u62a5\u540d\uff1b\u5206\u58f0\u90e8\u6295\u7968\u5219\u5bf9\u5f00\u59cb\u65f6\u4e00\u81f3\u4e24\u4eba\u7684\u58f0\u90e8\u5206\u522b\u9501\u5b9a\u3002\u4eba\u6570\u8f83\u591a\u65f6\u53ef\u4ee5\u7ee7\u7eed\u62a5\u540d\u3002\u5f00\u59cb\u540e\u82e5\u9000\u51fa\u4f1a\u4f7f\u67d0\u7ec4\u5269\u4e0b\u5c11\u4e8e\u4e09\u4f4d\uff0c\u9000\u51fa\u6309\u94ae\u4f1a\u7981\u7528\uff0c\u907f\u514d\u5f71\u54cd\u5df2\u7ecf\u6295\u51fa\u7684\u9009\u7968\u3002</p>\n<h4>\u7ed3\u679c\u4e0e\u5386\u53f2</h4>\n<p>\u7ed3\u679c\u6309\u652f\u6301\u7968\u6392\u5e8f\uff0c\u9ed8\u8ba4\u663e\u793a\u524d\u4e24\u4e2a\u540d\u6b21\uff0c\u5305\u542b\u6240\u6709\u5e76\u5217\u3002Duet \u7ec4\u5408\u6309\u7ec4\u5408\u6392\u540d\uff0c\u5206\u58f0\u90e8\u6295\u7968\u6309 A\u3001B \u5206\u522b\u6392\u540d\u3002MD \u53ef\u7ee7\u7eed\u63ed\u6653\u540e\u7eed\u540d\u6b21\uff0c\u6210\u5458\u89c6\u56fe\u4e0d\u663e\u793a\u6c47\u603b\u7968\u6570\u3002\u6700\u8fd1\u6700\u591a\u663e\u793a 12 \u4e2a\u5df2\u7ed3\u675f\u8f6e\u6b21\u3002</p>\n<p>\u7ed3\u679c\u4f9b MD \u4e0e\u7f16\u66f2\u8005\u53c2\u8003\uff0c\u7cfb\u7edf\u4e0d\u4f1a\u81ea\u52a8\u786e\u5b9a\u6f14\u51fa\u4eba\u9009\u3002\u540c\u4e00\u4e2a\u4eba\u53ef\u80fd\u51fa\u73b0\u5728\u591a\u4e2a\u83b7\u9009\u7ec4\u5408\u4e2d\u3002</p>\n<p></p>\n<h4>\u5f55\u97f3\u4e0e\u56de\u542c</h4><p>\u62a5\u540d\u540e\uff0c\u5728\u81ea\u5df1\u7684\u53c2\u9009\u5361\u7247\u4e2d\u6253\u5f00 <strong>\u5f55\u97f3 / \u4e0a\u4f20\u97f3\u9891</strong>\u3002\u5141\u8bb8\u9ea6\u514b\u98ce\u6743\u9650\uff0c\u70b9 <strong>\u5f00\u59cb\u5f55\u97f3 \u2192 \u505c\u6b62\u5e76\u8bd5\u542c \u2192 \u4fdd\u5b58\u5f55\u97f3</strong>\uff1b\u4e0d\u6ee1\u610f\u53ef\u4ee5\u91cd\u65b0\u5f55\u5236\uff0c\u4e5f\u53ef\u4ee5\u4e0a\u4f20\u5df2\u6709\u97f3\u9891\u3002Duet \u7ec4\u5408\u9700\u5148\u7531\u642d\u6863\u786e\u8ba4\uff0c\u4e24\u4f4d\u642d\u6863\u90fd\u53ef\u4ee5\u6dfb\u52a0\u6216\u5220\u9664\u7ec4\u5408\u5f55\u97f3\u3002</p><p>\u6240\u6709\u767b\u5f55\u6210\u5458\u90fd\u53ef\u4ee5\u64ad\u653e\u4fdd\u5b58\u7684\u5f55\u97f3\u3002\u5f55\u97f3\u4e0d\u9650\u5236\u65f6\u957f\uff0c\u5355\u4e2a\u6587\u4ef6\u6700\u591a <strong>50 MB</strong>\uff1b\u6295\u7968\u8fdb\u884c\u4e2d\u6301\u7eed\u4fdd\u7559\uff0c\u7ed3\u675f\u540e\u4fdd\u7559 <strong>7 \u5929</strong>\uff0c\u53ef\u5728\u5386\u53f2\u8f6e\u6b21\u91cc\u56de\u542c\uff0c\u4e4b\u540e\u81ea\u52a8\u6e05\u7406\u3002\u6295\u7968\u7ed3\u679c\u7ee7\u7eed\u4fdd\u7559\u3002\u60f3\u957f\u671f\u7559\u5b58\uff0c\u8bf7\u5728\u4fdd\u5b58\u524d\u4e0b\u8f7d\u81ea\u5df1\u7684\u5f55\u97f3\u526f\u672c\u3002</p>\n<a id=\"scores\"></a>\n<h3>5. \u67e5\u770b\u4e50\u8c31</h3>\n<ol>\n<li>\u4ece\u4e3b\u9875\u8fdb\u5165 <strong>\u67e5\u770b/\u4e0a\u4f20\u4e50\u8c31</strong>\u3002</li>\n<li>\u5728 <strong>\u67e5\u770b\u4e50\u8c31</strong> \u533a\u57df\u9009\u62e9\u5b66\u671f\uff0c\u4f8b\u5982 <code>2026 Fall</code>\u3002</li>\n<li>\u70b9\u51fb\u66f2\u76ee\u6587\u4ef6\u5939\uff0c\u6216\u5b66\u671f\u6587\u4ef6\u5939\u94fe\u63a5\uff0c\u5728 Google Drive \u4e2d\u67e5\u770b\u3001\u4e0b\u8f7d\u4e50\u8c31\u3002</li>\n</ol>\n<p>Google \u4e50\u8c31\u5e93\u9700\u8981\u7ba1\u7406\u5458\u5148\u914d\u7f6e\u3002\u82e5\u9875\u9762\u63d0\u793a\u5c1a\u672a\u8bbe\u7f6e\u597d\uff0c\u8054\u7cfb\u7ba1\u7406\u5458\u5373\u53ef\uff0c\u6210\u5458\u4e0d\u9700\u8981\u81ea\u5df1\u914d\u7f6e Google Cloud\u3002</p>\n<p>\u7f51\u7ad9\u8d26\u53f7\u4e0e Google \u8d26\u53f7\u4e0d\u662f\u540c\u4e00\u4e2a\u7cfb\u7edf\u3002\u6253\u5f00 Drive \u6587\u4ef6\u4ecd\u53d7 Google Drive \u7684\u5171\u4eab\u6743\u9650\u9650\u5236\uff1b\u82e5\u63d0\u793a\u6ca1\u6709\u6743\u9650\uff0c\u786e\u8ba4\u767b\u5f55\u4e86\u6b63\u786e\u7684 Google \u8d26\u53f7\uff0c\u5e76\u5411\u793e\u56e2\u7ba1\u7406\u5458\u7533\u8bf7\u8be5\u6587\u4ef6\u5939\u7684\u8bbf\u95ee\u6743\u9650\u3002</p>\n<a id=\"upload\"></a>\n<h3>6. \u4e0a\u4f20\u4e0e\u4fee\u6539\u4e50\u8c31</h3>\n<p>\u53ea\u6709\u88ab\u6307\u5b9a\u4e3a <strong>Arranger</strong> \u7684\u8d26\u53f7\u80fd\u4e0a\u4f20\u548c\u4fee\u6539\u4e50\u8c31\uff1b\u4ec5\u62e5\u6709 Music Director \u6216\u5176\u4ed6\u793e\u56e2\u804c\u4f4d\uff0c\u4e0d\u4f1a\u81ea\u52a8\u83b7\u5f97\u4e0a\u4f20\u6743\u9650\u3002</p>\n<h4>\u4e0a\u4f20\u65b0\u66f2\u76ee</h4>\n<ol>\n<li>\u8fdb\u5165 <strong>\u67e5\u770b/\u4e0a\u4f20\u4e50\u8c31</strong>\uff0c\u627e\u5230 <strong>\u4e0a\u4f20\u4e50\u8c31</strong> \u8868\u5355\u3002</li>\n<li>\u586b\u5199\u66f2\u540d\u3002</li>\n<li>\u9009\u62e9\u7f16\u66f2\u8005\uff0c\u53ef\u4ee5\u591a\u9009\uff1b\u540d\u5355\u6ca1\u6709\u76f8\u5e94\u540d\u5b57\u65f6\uff0c\u8f93\u5165\u540d\u5b57\u5e76\u70b9\u51fb <strong>\u6dfb\u52a0</strong>\u3002</li>\n<li>\u9009\u62e9\u5b66\u671f\u3002</li>\n<li>\u52fe\u9009 <strong>\u5927\u6b4c / All members</strong>\u3001<strong>\u5c0f\u7ec4 / Small group</strong>\uff0c\u81f3\u5c11\u9009\u4e00\u9879\uff0c\u4e5f\u53ef\u4ee5\u540c\u65f6\u9009\u4e24\u9879\u3002</li>\n<li>\u9009\u62e9\u4e00\u4e2a\u6216\u591a\u4e2a\u6587\u4ef6\uff0c\u6216\u4f7f\u7528\u652f\u6301\u6587\u4ef6\u5939\u9009\u62e9\u7684\u6d4f\u89c8\u5668\u4e0a\u4f20\u6587\u4ef6\u5939\u3002</li>\n<li>\u70b9\u51fb <strong>\u4e0a\u4f20</strong>\uff0c\u7b49\u5f85\u6210\u529f\u63d0\u793a\u3002</li>\n</ol>\n<p>\u6587\u4ef6\u4f1a\u653e\u5230 <code>\u793e\u56e2\u5927\u6587\u4ef6\u5939 \u2192 \u5b66\u671f \u2192 \u66f2\u540d</code> \u4e0b\uff0c\u540c\u65f6\u5728 Google Sheets \u4e50\u8c31\u7d22\u5f15\u4e2d\u6dfb\u52a0\u8bb0\u5f55\u3002\u5e38\u89c1\u4e50\u8c31\u683c\u5f0f\u5305\u62ec PDF\u3001MuseScore <code>.mscz</code>\u3001MusicXML <code>.musicxml</code> / <code>.xml</code> / <code>.mxl</code> \u548c\u56fe\u7247\u3002</p>\n<p>\u7ebf\u4e0a\u7248\u6bcf\u6b21\u4e0a\u4f20\u7684<strong>\u6240\u6709\u6587\u4ef6\u5408\u8ba1\u9700\u5c0f\u4e8e 20 MB</strong>\uff0c\u4e0d\u662f\u6bcf\u4e2a\u6587\u4ef6\u5404\u6709 20 MB\u3002\u66f4\u5927\u7684\u66f2\u76ee\u6587\u4ef6\u5939\u8bf7\u5206\u6279\u6dfb\u52a0\uff1b\u624b\u673a\u6d4f\u89c8\u5668\u82e5\u4e0d\u652f\u6301\u9009\u62e9\u6574\u4e2a\u6587\u4ef6\u5939\uff0c\u53ef\u4ee5\u6539\u9009\u591a\u4e2a\u6587\u4ef6\u3002</p>\n<h4>\u4fee\u6539\u5df2\u6709\u66f2\u76ee</h4>\n<ol>\n<li>\u70b9\u51fb <strong>\u66f4\u65b0\u5df2\u6709\u66f2\u76ee</strong>\u3002</li>\n<li>\u5728\u6807\u9898\u65c1\u70b9\u51fb\u300c\u66f4\u65b0\u5df2\u6709\u66f2\u76ee\u300d\uff0c\u641c\u7d22\u6574\u4e2a\u66f2\u5e93\uff0c\u6216\u6309 Google Drive \u5b66\u671f\u6587\u4ef6\u5939\u7b5b\u9009\uff1b\u6eda\u52a8\u67e5\u770b\u7ed3\u679c\uff0c\u9009\u4e2d\u66f2\u76ee\u540e\u624d\u663e\u793a\u4fe1\u606f\u8868\u5355\uff0c\u5e76\u81ea\u52a8\u5e26\u5165\u539f\u5b66\u671f\u3002</li>\n<li>\u4fee\u6539\u66f2\u540d\u3001\u7f16\u66f2\u8005\u3001\u6027\u8d28\u6216\u76ee\u6807\u5b66\u671f\uff1b\u4e5f\u53ef\u4ee5\u589e\u52a0\u65b0\u6587\u4ef6\u3001\u52fe\u9009\u8981\u5220\u9664\u7684\u65e7\u6587\u4ef6\u3002</li>\n<li>\u70b9\u51fb\u4fdd\u5b58\uff1b\u53ea\u6709\u4fdd\u5b58\u540e\u4fee\u6539\u624d\u4f1a\u751f\u6548\u3002\u53d6\u6d88\u4fee\u6539\u4f1a\u9000\u51fa\u7f16\u8f91\u3002</li>\n</ol>\n<p>\u7f16\u8f91\u5c5e\u4e8e\u5171\u4eab\u4e50\u8c31\u5e93\u64cd\u4f5c\uff0c\u4e0d\u53ea\u4fee\u6539\u4f60\u81ea\u5df1\u770b\u5230\u7684\u5185\u5bb9\u3002\u7cfb\u7edf\u76ee\u524d\u5141\u8bb8 Arranger \u7f16\u8f91\u5e93\u4e2d\u5df2\u6709\u66f2\u76ee\uff0c\u5e76\u672a\u9650\u5b9a\u53ea\u80fd\u7f16\u8f91\u672c\u4eba\u4e0a\u4f20\u7684\u66f2\u76ee\uff1b\u8bf7\u6309\u7167\u793e\u56e2\u7ea6\u5b9a\u64cd\u4f5c\u3002</p><p>\u52fe\u9009\u5927\u6b4c\u4f1a\u81ea\u52a8\u9501\u5b9a\u62a5\u540d\uff0c\u53d6\u6d88\u52fe\u9009\u6062\u590d\u62a5\u540d\u3002\u53d1\u8d77 Solo \u6295\u7968\u65f6\u53ef\u4ece\u5f53\u524d\u5b66\u671f\u9009\u62e9\u6b4c\u66f2\uff1b\u9635\u5bb9\u8868 Solo \u680f\u7684\u6295\u7968\u7ed3\u679c\u5165\u53e3\u663e\u793a\u8fd9\u9996\u6b4c\u5173\u8054\u7684\u5386\u53f2\u6392\u540d\u3002</p><p>\u53d1\u8d77\u5173\u8054\u6b4c\u66f2\u7684 Solo \u6295\u7968\u65f6\uff0c\u540d\u79f0\u6846\u524d\u4f1a\u663e\u793a\u300c\u6b4c\u540d-\u300d\uff0c\u53ea\u9700\u8f93\u5165\u672c\u8f6e\u540d\u79f0\u3002\u5386\u53f2\u6295\u7968\u4fee\u6539\u540d\u79f0\u6216\u6b4c\u66f2\u5173\u8054\u540e\uff0c\u539f\u6709\u7968\u6570\u548c\u6392\u540d\u4fdd\u7559\u3002</p>", "en": "<a id=\"quick-start\"></a>\n<h2>Quick Start</h2>\n<p><strong>We recommend adding the website to your phone\u2019s home screen so you can open it like an app to browse scores and vote.</strong> No App Store download is needed.</p>\n<a id=\"mobile\"></a>\n<h3>On Your Phone: Add to Home Screen</h3>\n<ol>\n<li>Open <a href=\"https://cucac-hub.vercel.app\">A Cappella Hub</a> in your phone\u2019s browser.</li>\n<li><strong>iPhone:</strong> Open in Safari or Chrome, choose <strong>Add to Home Screen</strong> from the share menu, then tap <strong>Add</strong>.</li>\n<li><strong>Other phones:</strong> Look for <strong>Add to Home Screen</strong> or an installation option in the browser menu. Availability and wording depend on the browser.</li>\n<li>Open the <strong>CUCAC</strong> icon on your home screen and sign in.</li>\n</ol>\n<p>This is a home screen shortcut to the website and requires an internet connection. If you already have an account, use it on both your phone and computer; no new registration is needed.</p>\n<h3>Your First Visit</h3>\n<ol>\n<li>Open the <strong>CUCAC</strong> home screen icon or the website link above.</li>\n<li>Tap <strong>\u7b2c\u4e00\u6b21\u6765\uff1f\u6ce8\u518c</strong> (\u201cFirst time? Register\u201d) to create an account with your name, or sign in if you already have one.</li>\n<li>Fill in your information under <strong>My profile</strong>.</li>\n<li>From the home page, open <strong>Members</strong>, <strong>Scores</strong>, or <strong>Solo / Duet voting</strong>.</li>\n</ol>\n<a id=\"members\"></a>\n<h2>Everyday Use</h2>\n<p><strong>Using your phone:</strong> Follow the <a href=\"#mobile\">home screen setup steps</a> above. Then tap the <strong>CUCAC</strong> icon and sign in to browse scores, vote for solos, and update your profile.</p>\n<a id=\"accounts\"></a>\n<h3>Accounts and Sign-in</h3>\n<ul>\n<li>Your <strong>name</strong> is your username, up to 20 characters. Choose a name other members will recognize. Usernames must be unique; capitalization does not distinguish English names.</li>\n<li>Your <strong>password</strong> must be 4\u201372 characters. Use a password dedicated to this website.</li>\n<li>Registration takes you directly to the home page. Use the same name and password to sign in on another device.</li>\n<li>Your username and <strong>English full name</strong> are separate fields. Editing your full name does not change your username.</li>\n<li>Select <strong>Log out</strong> after using a shared device.</li>\n<li>Contact an administrator if you forget your password. There is no email password recovery; administrators can reset regular members\u2019 passwords.</li>\n</ul>\n<a id=\"profile\"></a>\n<h3>My Profile</h3>\n<p>Open <strong>My profile</strong> from the home page. Fill in your English full name, pronouns, voice part, school, graduation year, major, fun fact, and favorite food, then save. Use a four-digit graduation year, such as <code>2027</code>.</p>\n<p>Each profile has a <strong>Photo gallery</strong>. Any signed-in member can add photos of that person. Each photo must be under 5 MB; JPG, PNG, WebP, and GIF are supported. Click a photo to enlarge it and see who uploaded it.</p>\n<ul><li>The <strong>profile owner</strong> can delete any photo in their gallery and choose <strong>Set as avatar</strong>.</li><li><strong>Uploaders</strong> can delete their own uploads. Other members cannot change the owner's avatar.</li><li>Deleting the photo used as the current avatar removes the avatar too; choose another photo afterward.</li><li>Existing avatars are automatically preserved when the gallery is first opened. Without an avatar, the first character of the member's name is shown.</li></ul>\n<p>Profiles and galleries are visible to other signed-in members. Share only information and photos you are comfortable sharing with the group.</p>\n<p>Voice parts allow multiple selections: Soprano, Alto, Tenor, Baritone, Bass, Bbox, and Rap. Choose Edit in My profile, check your parts, then Save. The MD can click Edit in another member\u2019s voice-part section and Save to apply changes. The Active list shows parts beside names and defaults to voice-part order, alphabetical within each part. The small button beside Active switches to alphabetical order; the right-hand dropdown independently filters by part. Members with multiple parts appear once, under their earliest selected part.</p>\n<p>Check Crew / Media below the voice parts and save to join the Crew / Media list. Uncheck and save to return to your previous member group.</p>\n<a id=\"roster\"></a>\n<h3>Members</h3>\n<ul>\n<li>Members are grouped into <strong>Active</strong> and <strong>Alumni</strong>.</li>\n<li>Select a member\u2019s name to view their profile.</li>\n<li>Regular members can edit only their own profiles, not other members\u2019 roles or accounts.</li>\n<li>Music Director, Arranger, and board position labels are assigned by an administrator or someone with the appropriate permission; you cannot assign them to yourself through your profile.</li>\n</ul>\n<a id=\"song-plan\"></a><h3>What Are We Singing?</h3><p>Open <strong>What Are We Singing?</strong> from the home page. It defaults to the current semester; use the dropdown to view archived semesters.</p><ul><li><strong>Songs</strong> appear down the left, with <strong>Solo, Soprano, Alto, Tenor, Baritone, Bass, Bbox</strong> across the top. Each cell can contain multiple singers. On phones, scroll horizontally while the song column stays visible.</li><li>Active members can select <strong>+ Join</strong> in any non-Solo cell, regardless of their profile voice parts. You may sing multiple parts in one song. <strong>\u00d7</strong> beside your name removes only that part.</li><li><strong>The MD assigns Solo singers</strong>; members cannot join or remove Solo themselves. The MD can add or remove singers in any part and confirm a lineup to lock member signup.</li><li><strong>Add / manage songs</strong> supports checking multiple library songs and selecting all results. Search the whole library by default, or browse a semester\u2019s Google Drive folder, just like updating existing scores.</li><li>For scores not uploaded yet, <strong>enter the song title manually</strong> and begin arranging the lineup. It shows \u201cScores pending.\u201d Selecting the same title from the library later links its folder while preserving signup.</li><li>In <strong>Semester settings</strong>, the MD can choose the current semester or start a new one. Switching archives the other semesters as read only, preserving their roster and lineup. The performance plan is managed independently of the contents of score-library semester folders.</li><li><strong>Scores \u2197</strong> opens the linked folder. Removing a song from a semester keeps its scores and signup; re-adding restores them.</li><li>Google Sheet <strong>Semester</strong> retains every performance semester. Reusing a song appends the new semester without overwriting history. Google failures leave the list saved; sync can be retried and also retries daily.</li></ul><p>Checking Full group fills all active singers into their matching profile parts, including multiple parts. Solo and existing assignments remain; unchecking keeps the lineup.</p><a id=\"voting\"></a>\n<h3>Solo / Duet Voting</h3>\n<p>The MD chooses one of four methods when opening a round:</p>\n<table><tr><td>Method</td><td>Registration and voting</td></tr><tr><td>Solo \u00b7 Default Voting</td><td>Register individually. Choose one of two singers, or up to two of three or more.</td></tr><tr><td>Solo \u00b7 Like Voting</td><td>Register individually. Give each singer \u201csounds great\u201d or \u201cnot sure yet\u201d feedback.</td></tr><tr><td>Duet \u00b7 Pair Voting</td><td>Invite a partner; they must confirm before the pair joins. Choose one of two pairs, or up to two of three or more. A singer may join multiple pairs with different partners.</td></tr><tr><td>Duet \u00b7 Part Voting</td><td>Register for Part A or Part B, one part per person. Vote and rank separately within each part: choose one of one or two singers, or up to two of three or more.</td></tr></table>\n<ol><li>Open Solo / Duet voting to see the song, arranger and voting method.</li><li>For Pair Voting, invite a partner, who can confirm or decline after signing in. For Part Voting, choose your part.</li><li>Wait for the MD to select Start voting. Confirmed entries are shuffled; later entries appear at the end.</li><li>Select your favorites and click again to unselect. Choices save automatically and cannot be changed after the round closes.</li></ol>\n<p>The MD can name the parts, such as \u201cHigh voice / Low voice.\u201d Only one round runs at a time. Pair Voting needs at least two confirmed pairs; Part Voting needs at least one singer in each part before voting starts.</p>\n<p>Starting with two soloists or two pairs locks registration. In Part Voting, each part starting with one or two singers locks separately. Larger groups allow later entries. After voting starts, withdrawal is disabled if it would leave fewer than three entries in a group, protecting existing ballots.</p>\n<h4>Results and History</h4>\n<p>Results rank by support votes. The first two ranks, including all ties, are initially shown. Pair Voting ranks pairs; Part Voting ranks A and B separately. The MD can reveal later ranks. Member views do not show aggregate counts. Up to 12 completed rounds appear in history.</p>\n<p>Results help the MD and arranger decide; the system does not automatically choose the performers. The same singer may appear in multiple leading pairs.</p>\n<p></p>\n<h4>Record and listen back</h4><p>After joining, open <strong>Record / upload audio</strong> on your own entry. Allow microphone access, then choose <strong>Record \u2192 Stop and preview \u2192 Save recording</strong>. You can record again or upload an existing audio file. Duet pairs must be confirmed first; either partner can add or delete recordings for their pair.</p><p>All signed-in members can play saved recordings. There is no recording time limit; each file can be up to <strong>50 MB</strong>. Recordings stay available while voting is open and for <strong>7 days after it closes</strong>, including in round history, before automatic cleanup. Voting results remain. To keep your recording longer, download your own copy before saving.</p>\n<a id=\"scores\"></a>\n<h3>Browse Scores</h3>\n<ol>\n<li>Open <strong>Scores</strong> from the home page.</li>\n<li>Choose a semester, such as <code>2026 Fall</code>, in the score browsing area.</li>\n<li>Open a song folder or the semester folder link to view and download scores in Google Drive.</li>\n</ol>\n<p>An administrator must configure the Google score library first. If the page says setup is incomplete, contact an administrator. Members do not need to configure Google Cloud themselves.</p>\n<p>Your website account and Google account are separate. Drive files still follow Google Drive sharing permissions. If access is denied, check that you are signed in to the correct Google account and ask a club administrator for folder access.</p>\n<a id=\"upload\"></a>\n<h3>Upload and Edit Scores</h3>\n<p>Only accounts assigned the <strong>Arranger</strong> role can upload and edit scores. Being a Music Director or holding another club position does not automatically grant upload permission.</p>\n<h4>Upload a New Song</h4>\n<ol>\n<li>Open <strong>Scores</strong> and find the upload form.</li>\n<li>Enter the song title.</li>\n<li>Select one or more arrangers. If a name is missing, enter it and select <strong>Add</strong>.</li>\n<li>Choose a semester.</li>\n<li>Select <strong>All members</strong>, <strong>Small group</strong>, or both. At least one is required.</li>\n<li>Select one or more files, or upload a folder using a browser that supports folder selection.</li>\n<li>Select <strong>Upload</strong> and wait for the success message.</li>\n</ol>\n<p>Files are stored under <code>Club root folder \u2192 Semester \u2192 Song title</code>, with a record added to the Google Sheets score index. Common formats include PDF, MuseScore <code>.mscz</code>, MusicXML <code>.musicxml</code> / <code>.xml</code> / <code>.mxl</code>, and images.</p>\n<p>For the hosted version, <strong>all files in one upload must total less than 20 MB</strong>; the limit is not 20 MB per file. Add larger folders in batches. If your phone\u2019s browser cannot select a whole folder, select multiple files instead.</p>\n<h4>Edit an Existing Song</h4>\n<ol>\n<li>Select <strong>\u66f4\u65b0\u5df2\u6709\u66f2\u76ee</strong> (\u201cUpdate an existing song\u201d).</li>\n<li>Select Update an existing song beside the heading, then search the entire library or browse a semester\u2019s Google Drive folder. Scroll through the results and select a song to open its details; the original semester is filled in automatically.</li>\n<li>Edit the title, arrangers, type, or destination semester. You can also add files and select existing files to delete.</li>\n<li>Select <strong>Save</strong> to apply your changes. Canceling exits without saving.</li>\n</ol>\n<p>Edits affect the shared library, not just your own view. Arrangers can currently edit existing songs in the library, including songs uploaded by others. Follow the club\u2019s agreed practices.</p><p>Full group locks signup automatically; unchecking reopens signup. Select a current-semester song when creating a Solo poll. Voting results in its Solo cell opens linked historical rankings.</p><p>When linking a Solo poll to a song, its title field shows \u201cSong-\u201d before the input. Enter only the round name. Updating a past poll\u2019s name or linked song preserves its votes and rankings.</p>"};
