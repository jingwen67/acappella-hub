<script>
const content={"zh": "\u003ca id=\"quick-start\">\u003c/a>\n\u003ch2>快速开始\u003c/h2>\n\u003cp>\u003cstrong>推荐大家先把网站添加到手机主屏幕，以后像打开 App 一样进入，查看乐谱和投票更方便。\u003c/strong> 无需去 App Store 下载。\u003c/p>\n\u003ca id=\"mobile\">\u003c/a>\n\u003ch3>在手机上使用：添加到主屏幕\u003c/h3>\n\u003col>\n\u003cli>用手机浏览器打开 \u003ca href=\"https://cucac-hub.vercel.app\">A Cappella Hub\u003c/a>。\u003c/li>\n\u003cli>\u003cstrong>iPhone：\u003c/strong> 用 Safari 或 Chrome 打开，在分享菜单中选择 \u003cstrong>添加到主屏幕 / Add to Home Screen\u003c/strong>，再点击 \u003cstrong>添加 / Add\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>其他手机：\u003c/strong> 在浏览器菜单中寻找 \u003cstrong>添加到主屏幕 / Add to Home Screen\u003c/strong> 或安装选项；是否显示及具体名称取决于浏览器。\u003c/li>\n\u003cli>添加完成后，从手机主屏幕上的 \u003cstrong>CUCAC\u003c/strong> 图标打开，并登录自己的账号。\u003c/li>\n\u003c/ol>\n\u003cp>这是网站的主屏幕入口，需要联网使用。已有账号不用重新注册，手机和电脑登录同一个账号即可。\u003c/p>\n\u003ch3>第一次使用\u003c/h3>\n\u003col>\n\u003cli>从手机主屏幕的 \u003cstrong>CUCAC\u003c/strong> 图标进入，或打开上面的网站链接。\u003c/li>\n\u003cli>第一次使用，点击 \u003cstrong>第一次来？注册\u003c/strong>，用自己的名字创建账号；已有账号则直接登录。\u003c/li>\n\u003cli>在 \u003cstrong>我的资料 / My profile\u003c/strong> 补充个人信息。\u003c/li>\n\u003cli>从主页进入 \u003cstrong>全体成员 / Members\u003c/strong>、\u003cstrong>查看/上传乐谱 / Scores\u003c/strong> 或 \u003cstrong>Solo / Duet 投票\u003c/strong>。\u003c/li>\n\u003c/ol>\n\u003ca id=\"members\">\u003c/a>\n\u003ch2>成员日常使用\u003c/h2>\n\u003cp>\u003cstrong>手机使用推荐：\u003c/strong> 先按上面的 \u003ca href=\"#mobile\">添加到主屏幕步骤\u003c/a> 设置好入口。之后直接点击 \u003cstrong>CUCAC\u003c/strong> 图标，登录后就能查看乐谱、参加 Solo 投票和更新个人资料。\u003c/p>\n\u003ca id=\"accounts\">\u003c/a>\n\u003ch3>1. 注册、登录与账号\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>名字\u003c/strong>是登录名：最多 20 个字符，建议使用其他成员能认出的名字。相同名字（不区分英文大小写）不能重复注册。\u003c/li>\n\u003cli>\u003cstrong>密码\u003c/strong>为 4–72 个字符；请使用自己专门为这个网站设置的密码。\u003c/li>\n\u003cli>注册成功会直接进入主页。之后在另一台设备上，使用同一个名字和密码登录即可。\u003c/li>\n\u003cli>登录名与资料里的 \u003cstrong>英文全名 / English full name\u003c/strong> 是两个字段：修改全名不会修改登录名。\u003c/li>\n\u003cli>用完共享设备后，点击 \u003cstrong>退出 / Log out\u003c/strong>。\u003c/li>\n\u003cli>忘记密码时，请联系管理员。当前没有邮件找回密码功能；管理员可以重设普通成员的密码。\u003c/li>\n\u003c/ul>\n\u003ca id=\"profile\">\u003c/a>\n\u003ch3>2. 我的资料\u003c/h3>\n\u003cp>从主页进入 \u003cstrong>我的资料\u003c/strong>，填写英文全名、代词、声部、学校、毕业年份、专业、Fun fact 和喜欢的食物，再保存。毕业年份填写四位数字，例如 \u003ccode>2027\u003c/code>。\u003c/p>\n\u003cp>个人资料页有 \u003cstrong>相册 / Photo gallery\u003c/strong>：所有登录成员都能给这个人上传照片，每张需小于 5 MB，支持 JPG、PNG、WebP 和 GIF。点击照片可放大，并显示上传者名字。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>本人\u003c/strong>可以删除相册中的任何照片，并点击 \u003cstrong>设为头像 / Set as avatar\u003c/strong> 选择头像。\u003c/li>\u003cli>\u003cstrong>上传者\u003c/strong>可以删除自己上传的照片；其他成员不能替本人更换头像。\u003c/li>\u003cli>删除当前头像对应的照片时，头像也会移除，可重新选择另一张。\u003c/li>\u003cli>原有头像会在首次打开相册时自动保留。没有照片时显示名字首字。\u003c/li>\u003c/ul>\n\u003cp>资料和相册对其他登录成员可见，请只填写或上传愿意与社团成员分享的内容。\u003c/p>\n\u003cp>声部支持多选 Soprano、Alto、Tenor、Baritone、Bass、Bbox 和 Rap。在我的资料点 Edit，勾选声部后 Save。MD 可在其他成员资料的声部栏点 Edit，修改后 Save 生效。Active 名单在姓名旁显示声部，默认按声部排序，声部内部按名字首字母排序；Active 旁的小按钮可切换为按首字母排序，右侧下拉框可独立筛选声部。兼任多个声部的成员按所选声部中最靠前的声部排序，每人只显示一次。\u003c/p>\n\u003cp>在声部选项下勾选 Crew / Media 并保存，会自动进入 Crew / Media 名单；取消勾选并保存后恢复原有成员分组。\u003c/p>\n\u003ca id=\"roster\">\u003c/a>\n\u003ch3>3. 全体成员\u003c/h3>\n\u003cul>\n\u003cli>成员按 \u003cstrong>Active\u003c/strong> 和 \u003cstrong>Alumni\u003c/strong> 分组。\u003c/li>\n\u003cli>点击成员名字可以查看其资料。\u003c/li>\n\u003cli>普通成员只能修改自己的资料，不能修改其他人的角色或账号。\u003c/li>\n\u003cli>Music Director、Arranger 和社团职位标签由管理员或有相应权限的人设置，不能在个人资料里自行获得。\u003c/li>\n\u003c/ul>\n\u003ca id=\"song-plan\">\u003c/a>\u003ch3>歌曲人员表 · Song Plan\u003c/h3>\u003cp>从主页进入 \u003cstrong>歌曲人员表\u003c/strong>，默认打开当前学期（首次为 \u003cstrong>2026 Fall\u003c/strong>）；顶部可切换历史学期。\u003c/p>\u003cul>\u003cli>电脑查看按声部分组的人员表：行是成员、列是歌曲，格子显示该曲声部 \u003ccode>S / A / T / Bar / B / BB / R\u003c/code>，底部显示人数与各声部人数。兼任声部的人按 Profile 中最靠前的声部分组，每人只出现一次。\u003c/li>\u003cli>点击\u003cstrong>歌名\u003c/strong>查看阵容或报名；每首歌选择一个声部，和 Profile 声部分开保存，可更改或退出报名。\u003c/li>\u003cli>点击 \u003cstrong>乐谱 ↗\u003c/strong> 直接打开对应 Google Drive 文件夹。\u003c/li>\u003cli>手机先显示歌曲卡片，可点 \u003cstrong>查看人员表\u003c/strong> 切换为横向滚动表格。\u003c/li>\u003cli>MD 可从曲库搜索并选择歌曲，自动关联曲名和乐谱文件夹，也可手动添加、稍后补链接。MD 可安排成员及声部，在歌曲设置中确认阵容并锁定报名。\u003c/li>\u003cli>MD 可创建新学期、归档学期或恢复编辑。归档后只读，保留当时的成员名称、声部和阵容，后续资料变更不会改写历史。\u003c/li>\u003c/ul>\u003ca id=\"voting\">\u003c/a>\n\u003ch3>Solo / Duet 投票\u003c/h3>\n\u003cp>发起轮次时，MD 可以选择四种方式：\u003c/p>\n\u003ctable>\u003ctr>\u003ctd>方式\u003c/td>\u003ctd>报名与投票\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Solo · 默认投票\u003c/td>\u003ctd>个人报名；两人场最多选一人，三人及以上最多选两人。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Solo · 点赞投票\u003c/td>\u003ctd>个人报名；对每位参选人选择「好听 / 再听听」。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duet · 组合投票（Pair Voting）\u003c/td>\u003ctd>邀请搭档，对方确认后参选；两组最多选一组，三组及以上最多选两组。同一人可与不同搭档组成多组。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duet · 分声部投票（Part Voting）\u003c/td>\u003ctd>选择 Part A 或 Part B 报名，每人只报一个声部；两个声部分别投票、排名。每声部一至两人最多选一人，三人及以上最多选两人。\u003c/td>\u003c/tr>\u003c/table>\n\u003col>\u003cli>进入 Solo / Duet 投票，查看曲目、编曲者和投票方式。\u003c/li>\u003cli>组合投票中，选择搭档并发出邀请；搭档登录后确认或婉拒。分声部投票中，选择要报名的声部。\u003c/li>\u003cli>等待 MD 点击 开始投票。此前已确认的参选人或组合随机排序，后来新增的排在末尾。\u003c/li>\u003cli>选择喜欢的参选人或组合，再次点击可取消；选择自动保存。轮次结束后不能修改。\u003c/li>\u003c/ol>\n\u003cp>MD 可以给分声部投票的两个声部设置名称，例如「高声部 / 低声部」。同一时间只进行一个轮次。组合投票至少需要两组已确认的搭档；分声部投票需要两个声部各至少一人才能开始。\u003c/p>\n\u003cp>开始时只有两个 Solo 参选人或两个组合会锁定报名；分声部投票则对开始时一至两人的声部分别锁定。人数较多时可以继续报名。开始后若退出会使某组剩下少于三位，退出按钮会禁用，避免影响已经投出的选票。\u003c/p>\n\u003ch4>结果与历史\u003c/h4>\n\u003cp>结果按支持票排序，默认显示前两个名次，包含所有并列。Duet 组合按组合排名，分声部投票按 A、B 分别排名。MD 可继续揭晓后续名次，成员视图不显示汇总票数。最近最多显示 12 个已结束轮次。\u003c/p>\n\u003cp>结果供 MD 与编曲者参考，系统不会自动确定演出人选。同一个人可能出现在多个获选组合中。\u003c/p>\n\u003cp>\u003c/p>\n\u003ch4>录音与回听\u003c/h4>\u003cp>报名后，在自己的参选卡片中打开 \u003cstrong>录音 / 上传音频\u003c/strong>。允许麦克风权限，点 \u003cstrong>开始录音 → 停止并试听 → 保存录音\u003c/strong>；不满意可以重新录制，也可以上传已有音频。Duet 组合需先由搭档确认，两位搭档都可以添加或删除组合录音。\u003c/p>\u003cp>所有登录成员都可以播放保存的录音。录音不限制时长，单个文件最多 \u003cstrong>50 MB\u003c/strong>；投票进行中持续保留，结束后保留 \u003cstrong>7 天\u003c/strong>，可在历史轮次里回听，之后自动清理。投票结果继续保留。想长期留存，请在保存前下载自己的录音副本。\u003c/p>\n\u003ca id=\"scores\">\u003c/a>\n\u003ch3>5. 查看乐谱\u003c/h3>\n\u003col>\n\u003cli>从主页进入 \u003cstrong>查看/上传乐谱\u003c/strong>。\u003c/li>\n\u003cli>在 \u003cstrong>查看乐谱\u003c/strong> 区域选择学期，例如 \u003ccode>2026 Fall\u003c/code>。\u003c/li>\n\u003cli>点击曲目文件夹，或学期文件夹链接，在 Google Drive 中查看、下载乐谱。\u003c/li>\n\u003c/ol>\n\u003cp>Google 乐谱库需要管理员先配置。若页面提示尚未设置好，联系管理员即可，成员不需要自己配置 Google Cloud。\u003c/p>\n\u003cp>网站账号与 Google 账号不是同一个系统。打开 Drive 文件仍受 Google Drive 的共享权限限制；若提示没有权限，确认登录了正确的 Google 账号，并向社团管理员申请该文件夹的访问权限。\u003c/p>\n\u003ca id=\"upload\">\u003c/a>\n\u003ch3>6. 上传与修改乐谱\u003c/h3>\n\u003cp>只有被指定为 \u003cstrong>Arranger\u003c/strong> 的账号能上传和修改乐谱；仅拥有 Music Director 或其他社团职位，不会自动获得上传权限。\u003c/p>\n\u003ch4>上传新曲目\u003c/h4>\n\u003col>\n\u003cli>进入 \u003cstrong>查看/上传乐谱\u003c/strong>，找到 \u003cstrong>上传乐谱\u003c/strong> 表单。\u003c/li>\n\u003cli>填写曲名。\u003c/li>\n\u003cli>选择编曲者，可以多选；名单没有相应名字时，输入名字并点击 \u003cstrong>添加\u003c/strong>。\u003c/li>\n\u003cli>选择学期。\u003c/li>\n\u003cli>勾选 \u003cstrong>大歌 / All members\u003c/strong>、\u003cstrong>小组 / Small group\u003c/strong>，至少选一项，也可以同时选两项。\u003c/li>\n\u003cli>选择一个或多个文件，或使用支持文件夹选择的浏览器上传文件夹。\u003c/li>\n\u003cli>点击 \u003cstrong>上传\u003c/strong>，等待成功提示。\u003c/li>\n\u003c/ol>\n\u003cp>文件会放到 \u003ccode>社团大文件夹 → 学期 → 曲名\u003c/code> 下，同时在 Google Sheets 乐谱索引中添加记录。常见乐谱格式包括 PDF、MuseScore \u003ccode>.mscz\u003c/code>、MusicXML \u003ccode>.musicxml\u003c/code> / \u003ccode>.xml\u003c/code> / \u003ccode>.mxl\u003c/code> 和图片。\u003c/p>\n\u003cp>线上版每次上传的\u003cstrong>所有文件合计需小于 20 MB\u003c/strong>，不是每个文件各有 20 MB。更大的曲目文件夹请分批添加；手机浏览器若不支持选择整个文件夹，可以改选多个文件。\u003c/p>\n\u003ch4>修改已有曲目\u003c/h4>\n\u003col>\n\u003cli>点击 \u003cstrong>更新已有曲目\u003c/strong>。\u003c/li>\n\u003cli>在标题旁点击「更新已有曲目」，搜索整个曲库，或按 Google Drive 学期文件夹筛选；滚动查看结果，选中曲目后才显示信息表单，并自动带入原学期。\u003c/li>\n\u003cli>修改曲名、编曲者、性质或目标学期；也可以增加新文件、勾选要删除的旧文件。\u003c/li>\n\u003cli>点击保存；只有保存后修改才会生效。取消修改会退出编辑。\u003c/li>\n\u003c/ol>\n\u003cp>编辑属于共享乐谱库操作，不只修改你自己看到的内容。系统目前允许 Arranger 编辑库中已有曲目，并未限定只能编辑本人上传的曲目；请按照社团约定操作。\u003c/p>", "en": "\u003ca id=\"quick-start\">\u003c/a>\n\u003ch2>Quick Start\u003c/h2>\n\u003cp>\u003cstrong>We recommend adding the website to your phone’s home screen so you can open it like an app to browse scores and vote.\u003c/strong> No App Store download is needed.\u003c/p>\n\u003ca id=\"mobile\">\u003c/a>\n\u003ch3>On Your Phone: Add to Home Screen\u003c/h3>\n\u003col>\n\u003cli>Open \u003ca href=\"https://cucac-hub.vercel.app\">A Cappella Hub\u003c/a> in your phone’s browser.\u003c/li>\n\u003cli>\u003cstrong>iPhone:\u003c/strong> Open in Safari or Chrome, choose \u003cstrong>Add to Home Screen\u003c/strong> from the share menu, then tap \u003cstrong>Add\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Other phones:\u003c/strong> Look for \u003cstrong>Add to Home Screen\u003c/strong> or an installation option in the browser menu. Availability and wording depend on the browser.\u003c/li>\n\u003cli>Open the \u003cstrong>CUCAC\u003c/strong> icon on your home screen and sign in.\u003c/li>\n\u003c/ol>\n\u003cp>This is a home screen shortcut to the website and requires an internet connection. If you already have an account, use it on both your phone and computer; no new registration is needed.\u003c/p>\n\u003ch3>Your First Visit\u003c/h3>\n\u003col>\n\u003cli>Open the \u003cstrong>CUCAC\u003c/strong> home screen icon or the website link above.\u003c/li>\n\u003cli>Tap \u003cstrong>第一次来？注册\u003c/strong> (“First time? Register”) to create an account with your name, or sign in if you already have one.\u003c/li>\n\u003cli>Fill in your information under \u003cstrong>My profile\u003c/strong>.\u003c/li>\n\u003cli>From the home page, open \u003cstrong>Members\u003c/strong>, \u003cstrong>Scores\u003c/strong>, or \u003cstrong>Solo / Duet voting\u003c/strong>.\u003c/li>\n\u003c/ol>\n\u003ca id=\"members\">\u003c/a>\n\u003ch2>Everyday Use\u003c/h2>\n\u003cp>\u003cstrong>Using your phone:\u003c/strong> Follow the \u003ca href=\"#mobile\">home screen setup steps\u003c/a> above. Then tap the \u003cstrong>CUCAC\u003c/strong> icon and sign in to browse scores, vote for solos, and update your profile.\u003c/p>\n\u003ca id=\"accounts\">\u003c/a>\n\u003ch3>Accounts and Sign-in\u003c/h3>\n\u003cul>\n\u003cli>Your \u003cstrong>name\u003c/strong> is your username, up to 20 characters. Choose a name other members will recognize. Usernames must be unique; capitalization does not distinguish English names.\u003c/li>\n\u003cli>Your \u003cstrong>password\u003c/strong> must be 4–72 characters. Use a password dedicated to this website.\u003c/li>\n\u003cli>Registration takes you directly to the home page. Use the same name and password to sign in on another device.\u003c/li>\n\u003cli>Your username and \u003cstrong>English full name\u003c/strong> are separate fields. Editing your full name does not change your username.\u003c/li>\n\u003cli>Select \u003cstrong>Log out\u003c/strong> after using a shared device.\u003c/li>\n\u003cli>Contact an administrator if you forget your password. There is no email password recovery; administrators can reset regular members’ passwords.\u003c/li>\n\u003c/ul>\n\u003ca id=\"profile\">\u003c/a>\n\u003ch3>My Profile\u003c/h3>\n\u003cp>Open \u003cstrong>My profile\u003c/strong> from the home page. Fill in your English full name, pronouns, voice part, school, graduation year, major, fun fact, and favorite food, then save. Use a four-digit graduation year, such as \u003ccode>2027\u003c/code>.\u003c/p>\n\u003cp>Each profile has a \u003cstrong>Photo gallery\u003c/strong>. Any signed-in member can add photos of that person. Each photo must be under 5 MB; JPG, PNG, WebP, and GIF are supported. Click a photo to enlarge it and see who uploaded it.\u003c/p>\n\u003cul>\u003cli>The \u003cstrong>profile owner\u003c/strong> can delete any photo in their gallery and choose \u003cstrong>Set as avatar\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Uploaders\u003c/strong> can delete their own uploads. Other members cannot change the owner's avatar.\u003c/li>\u003cli>Deleting the photo used as the current avatar removes the avatar too; choose another photo afterward.\u003c/li>\u003cli>Existing avatars are automatically preserved when the gallery is first opened. Without an avatar, the first character of the member's name is shown.\u003c/li>\u003c/ul>\n\u003cp>Profiles and galleries are visible to other signed-in members. Share only information and photos you are comfortable sharing with the group.\u003c/p>\n\u003cp>Voice parts allow multiple selections: Soprano, Alto, Tenor, Baritone, Bass, Bbox, and Rap. Choose Edit in My profile, check your parts, then Save. The MD can click Edit in another member’s voice-part section and Save to apply changes. The Active list shows parts beside names and defaults to voice-part order, alphabetical within each part. The small button beside Active switches to alphabetical order; the right-hand dropdown independently filters by part. Members with multiple parts appear once, under their earliest selected part.\u003c/p>\n\u003cp>Check Crew / Media below the voice parts and save to join the Crew / Media list. Uncheck and save to return to your previous member group.\u003c/p>\n\u003ca id=\"roster\">\u003c/a>\n\u003ch3>Members\u003c/h3>\n\u003cul>\n\u003cli>Members are grouped into \u003cstrong>Active\u003c/strong> and \u003cstrong>Alumni\u003c/strong>.\u003c/li>\n\u003cli>Select a member’s name to view their profile.\u003c/li>\n\u003cli>Regular members can edit only their own profiles, not other members’ roles or accounts.\u003c/li>\n\u003cli>Music Director, Arranger, and board position labels are assigned by an administrator or someone with the appropriate permission; you cannot assign them to yourself through your profile.\u003c/li>\n\u003c/ul>\n\u003ca id=\"song-plan\">\u003c/a>\u003ch3>Song Plan\u003c/h3>\u003cp>Open \u003cstrong>Song Plan\u003c/strong> from the home page. It defaults to the current semester (\u003cstrong>2026 Fall\u003c/strong> initially); use the semester dropdown to view older plans.\u003c/p>\u003cul>\u003cli>On a computer, rows are singers and columns are songs. Cells show that song’s part (\u003ccode>S / A / T / Bar / B / BB / R\u003c/code>); totals show the singer count and counts for all seven parts. Members appear once, grouped by their earliest selected profile part.\u003c/li>\u003cli>Click a \u003cstrong>song title\u003c/strong> to view the lineup or join. Choose one part per song, stored separately from your profile parts. You can change your part or withdraw while signup is open.\u003c/li>\u003cli>\u003cstrong>Scores ↗\u003c/strong> opens the linked Google Drive folder directly.\u003c/li>\u003cli>Phones show song cards first; \u003cstrong>View roster table\u003c/strong> opens the horizontally scrolling matrix.\u003c/li>\u003cli>The MD can search the score library to bring in a title and folder link, or add a song manually and attach scores later. The MD can assign singers and parts, then confirm the lineup and lock member signup in Song settings.\u003c/li>\u003cli>The MD can create semesters, archive them, or reopen editing. Archived plans are read only and preserve names, profile parts, and lineups as they were then.\u003c/li>\u003c/ul>\u003ca id=\"voting\">\u003c/a>\n\u003ch3>Solo / Duet Voting\u003c/h3>\n\u003cp>The MD chooses one of four methods when opening a round:\u003c/p>\n\u003ctable>\u003ctr>\u003ctd>Method\u003c/td>\u003ctd>Registration and voting\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Solo · Default Voting\u003c/td>\u003ctd>Register individually. Choose one of two singers, or up to two of three or more.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Solo · Like Voting\u003c/td>\u003ctd>Register individually. Give each singer “sounds great” or “not sure yet” feedback.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duet · Pair Voting\u003c/td>\u003ctd>Invite a partner; they must confirm before the pair joins. Choose one of two pairs, or up to two of three or more. A singer may join multiple pairs with different partners.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duet · Part Voting\u003c/td>\u003ctd>Register for Part A or Part B, one part per person. Vote and rank separately within each part: choose one of one or two singers, or up to two of three or more.\u003c/td>\u003c/tr>\u003c/table>\n\u003col>\u003cli>Open Solo / Duet voting to see the song, arranger and voting method.\u003c/li>\u003cli>For Pair Voting, invite a partner, who can confirm or decline after signing in. For Part Voting, choose your part.\u003c/li>\u003cli>Wait for the MD to select Start voting. Confirmed entries are shuffled; later entries appear at the end.\u003c/li>\u003cli>Select your favorites and click again to unselect. Choices save automatically and cannot be changed after the round closes.\u003c/li>\u003c/ol>\n\u003cp>The MD can name the parts, such as “High voice / Low voice.” Only one round runs at a time. Pair Voting needs at least two confirmed pairs; Part Voting needs at least one singer in each part before voting starts.\u003c/p>\n\u003cp>Starting with two soloists or two pairs locks registration. In Part Voting, each part starting with one or two singers locks separately. Larger groups allow later entries. After voting starts, withdrawal is disabled if it would leave fewer than three entries in a group, protecting existing ballots.\u003c/p>\n\u003ch4>Results and History\u003c/h4>\n\u003cp>Results rank by support votes. The first two ranks, including all ties, are initially shown. Pair Voting ranks pairs; Part Voting ranks A and B separately. The MD can reveal later ranks. Member views do not show aggregate counts. Up to 12 completed rounds appear in history.\u003c/p>\n\u003cp>Results help the MD and arranger decide; the system does not automatically choose the performers. The same singer may appear in multiple leading pairs.\u003c/p>\n\u003cp>\u003c/p>\n\u003ch4>Record and listen back\u003c/h4>\u003cp>After joining, open \u003cstrong>Record / upload audio\u003c/strong> on your own entry. Allow microphone access, then choose \u003cstrong>Record → Stop and preview → Save recording\u003c/strong>. You can record again or upload an existing audio file. Duet pairs must be confirmed first; either partner can add or delete recordings for their pair.\u003c/p>\u003cp>All signed-in members can play saved recordings. There is no recording time limit; each file can be up to \u003cstrong>50 MB\u003c/strong>. Recordings stay available while voting is open and for \u003cstrong>7 days after it closes\u003c/strong>, including in round history, before automatic cleanup. Voting results remain. To keep your recording longer, download your own copy before saving.\u003c/p>\n\u003ca id=\"scores\">\u003c/a>\n\u003ch3>Browse Scores\u003c/h3>\n\u003col>\n\u003cli>Open \u003cstrong>Scores\u003c/strong> from the home page.\u003c/li>\n\u003cli>Choose a semester, such as \u003ccode>2026 Fall\u003c/code>, in the score browsing area.\u003c/li>\n\u003cli>Open a song folder or the semester folder link to view and download scores in Google Drive.\u003c/li>\n\u003c/ol>\n\u003cp>An administrator must configure the Google score library first. If the page says setup is incomplete, contact an administrator. Members do not need to configure Google Cloud themselves.\u003c/p>\n\u003cp>Your website account and Google account are separate. Drive files still follow Google Drive sharing permissions. If access is denied, check that you are signed in to the correct Google account and ask a club administrator for folder access.\u003c/p>\n\u003ca id=\"upload\">\u003c/a>\n\u003ch3>Upload and Edit Scores\u003c/h3>\n\u003cp>Only accounts assigned the \u003cstrong>Arranger\u003c/strong> role can upload and edit scores. Being a Music Director or holding another club position does not automatically grant upload permission.\u003c/p>\n\u003ch4>Upload a New Song\u003c/h4>\n\u003col>\n\u003cli>Open \u003cstrong>Scores\u003c/strong> and find the upload form.\u003c/li>\n\u003cli>Enter the song title.\u003c/li>\n\u003cli>Select one or more arrangers. If a name is missing, enter it and select \u003cstrong>Add\u003c/strong>.\u003c/li>\n\u003cli>Choose a semester.\u003c/li>\n\u003cli>Select \u003cstrong>All members\u003c/strong>, \u003cstrong>Small group\u003c/strong>, or both. At least one is required.\u003c/li>\n\u003cli>Select one or more files, or upload a folder using a browser that supports folder selection.\u003c/li>\n\u003cli>Select \u003cstrong>Upload\u003c/strong> and wait for the success message.\u003c/li>\n\u003c/ol>\n\u003cp>Files are stored under \u003ccode>Club root folder → Semester → Song title\u003c/code>, with a record added to the Google Sheets score index. Common formats include PDF, MuseScore \u003ccode>.mscz\u003c/code>, MusicXML \u003ccode>.musicxml\u003c/code> / \u003ccode>.xml\u003c/code> / \u003ccode>.mxl\u003c/code>, and images.\u003c/p>\n\u003cp>For the hosted version, \u003cstrong>all files in one upload must total less than 20 MB\u003c/strong>; the limit is not 20 MB per file. Add larger folders in batches. If your phone’s browser cannot select a whole folder, select multiple files instead.\u003c/p>\n\u003ch4>Edit an Existing Song\u003c/h4>\n\u003col>\n\u003cli>Select \u003cstrong>更新已有曲目\u003c/strong> (“Update an existing song”).\u003c/li>\n\u003cli>Select Update an existing song beside the heading, then search the entire library or browse a semester’s Google Drive folder. Scroll through the results and select a song to open its details; the original semester is filled in automatically.\u003c/li>\n\u003cli>Edit the title, arrangers, type, or destination semester. You can also add files and select existing files to delete.\u003c/li>\n\u003cli>Select \u003cstrong>Save\u003c/strong> to apply your changes. Canceling exits without saving.\u003c/li>\n\u003c/ol>\n\u003cp>Edits affect the shared library, not just your own view. Arrangers can currently edit existing songs in the library, including songs uploaded by others. Follow the club’s agreed practices.\u003c/p>"};
const sections={zh:[["quick-start","快速开始"],["mobile","添加到手机主屏幕"],["members","日常使用"],["accounts","注册与登录"],["profile","我的资料"],["roster","全体成员"],["song-plan","歌曲人员表"],["voting","Solo 投票"],["scores","查看乐谱"],["upload","上传与修改乐谱"]],en:[["quick-start","Quick start"],["mobile","Add to home screen"],["members","Everyday use"],["accounts","Accounts & sign-in"],["profile","My profile"],["roster","Members"],["song-plan","Song Plan"],["voting","Solo voting"],["scores","Browse scores"],["upload","Upload & edit scores"]]};
let observer;
function setLanguage(lang){lang=lang==="en"?"en":"zh";try{localStorage.setItem("cucac-guide-language",lang)}catch{}document.documentElement.lang=lang==="en"?"en":"zh-Hans";document.getElementById("title").textContent=lang==="en"?"Your CUCAC guide":"CUCAC 使用指南";document.getElementById("intro").textContent=lang==="en"?"Start here, then find what you need in the outline.":"先看快速开始，再从目录找到你需要的内容。";document.getElementById("back").textContent=lang==="en"?"Back to hub":"返回网站";document.getElementById("return").textContent=lang==="en"?"Back to A Cappella Hub":"返回 A Cappella Hub";for(const id of ["zh","en"])document.getElementById(id).setAttribute("aria-pressed",String(id===lang));document.getElementById("content").innerHTML=content[lang];document.getElementById("outline").innerHTML="<p>"+(lang==="en"?"ON THIS PAGE":"本页目录")+"</p>"+sections[lang].map(([id,label])=>'<a href="#'+id+'">'+label+'</a>').join("");if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){document.querySelectorAll(".outline a").forEach(a=>a.setAttribute("aria-current",String(a.hash==="#"+e.target.id)));}},{rootMargin:"-15% 0px -65% 0px"});document.querySelectorAll("article a[id]").forEach(el=>observer.observe(el));if(location.hash){const target=document.getElementById(location.hash.slice(1));if(target)requestAnimationFrame(()=>target.scrollIntoView({behavior:"instant"}));}}
document.getElementById("zh").onclick=()=>setLanguage("zh");document.getElementById("en").onclick=()=>setLanguage("en");let preferred="zh";try{preferred=localStorage.getItem("cucac-guide-language")||(navigator.language.startsWith("zh")?"zh":"en")}catch{}setLanguage(preferred);
</script></body></html>
