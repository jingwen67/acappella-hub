<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CUCAC Showcase | Bubble Tea Pass</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f4eb;color:#263e30;font:16px system-ui}main{max-width:440px;margin:auto;padding:36px 20px}header{text-align:center}small{color:#647569}h1{font-size:32px;letter-spacing:-1px;margin:12px 0}section{background:white;border-radius:20px;padding:22px;margin:22px 0;box-shadow:0 5px 24px #243c2410}label{display:block;font-size:14px;font-weight:600;margin:14px 0 5px}input,button{font:inherit;width:100%;padding:13px;border-radius:10px;border:1px solid #cbd5c9}button{background:#315a46;color:white;border:0;margin-top:14px;cursor:pointer}button:disabled{opacity:.5}#message{color:#a33;white-space:pre-wrap}#ticket{text-align:center;background:#e0ebd8;overflow-wrap:anywhere}code{display:block;background:white;padding:12px;border-radius:8px;font-size:18px;user-select:all}article{border-bottom:1px solid #ddd;padding:10px 0;overflow-wrap:anywhere}footer{text-align:center;font-size:12px;color:#65756a}a{color:#315a46}</style><main><header><small>CUCAC SHOWCASE × ? TEA</small><h1>🧋 Bubble Tea Pass</h1><div>? Tea (Question Mark Tea) - Columbia University</div></header><section id="panel"></section><section id="ticket" hidden></section><p id="message" role="alert"></p><footer>One complimentary drink per voucher · 60 total</footer></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
const panel=document.querySelector('#panel'),ticket=document.querySelector('#ticket'),message=document.querySelector('#message');const mode=location.pathname==='/distribute'?'distribute':location.pathname==='/admin'?'admin':location.pathname==='/redeem'?'staff':'claim';let rows=[],opened=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,data={}){message.textContent='';try{const r=await fetch('/api/pass',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});const j=await r.json();if(j.error)throw Error(j.error);return j}catch(e){message.textContent=e.message;return null}}
let qrTimer; function show(v){clearTimeout(qrTimer);ticket.hidden=false;ticket.innerHTML='<small>COMPLIMENTARY DRINK</small><h2>'+esc(v.name)+'</h2><p>'+ (v.redeemed?'✓ 已兑换 · Redeemed':'有效兑换券 · Valid pass')+'</p><code>'+esc(v.code)+'</code>';if(mode==='claim'){if(v.qr&&!v.redeemed){const q=document.createElement('div');q.style.cssText='background:white;padding:12px;width:max-content;margin:12px auto';ticket.append(q);if(window.QRCode)new QRCode(q,{text:v.qr,width:220,height:220});else q.textContent='QR unavailable; use manual code';qrTimer=setTimeout(async()=>{const next=await api('ticket',{code:v.code});if(next)show(next);else q.textContent='Refresh page to renew QR'},30000);}const url=location.origin+'/#'+v.code;const a=document.createElement('a');a.href=url;a.textContent='Save this voucher link / 保存兑换券链接';ticket.append(a);const b=document.createElement('button');b.textContent='Copy voucher link';b.onclick=async()=>{try{await navigator.clipboard.writeText(url);b.textContent='Copied'}catch{message.textContent='Please copy the link manually'}};ticket.append(b)}}
const field=(name,label,type='text')=>'<label for="'+name+'">'+label+'</label><input id="'+name+'" name="'+name+'" type="'+type+'" required>';
function form(html,fn){panel.innerHTML='<form>'+html+'</form>';panel.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await fn(Object.fromEntries(new FormData(e.target)))}finally{b.disabled=false}}}
if(mode==='claim'){const incoming=new URLSearchParams(location.search).get('t');let session=sessionStorage.getItem('showcase-session');const saved=location.hash.slice(1)||localStorage.getItem('showcase-pass');if(saved){panel.innerHTML='<p>Your Showcase voucher</p><button id="refresh">Refresh status</button>';const load=async()=>{const v=await api('ticket',{code:saved});if(v)show(v)};document.querySelector('#refresh').onclick=load;load()}else{const start=async()=>{if(incoming){const v=await api('activate',{token:incoming});if(!v){panel.textContent='QR expired or already scanned. Please scan a new code.';return}session=v.session;sessionStorage.setItem('showcase-session',session);history.replaceState(null,'','/')}if(!session){panel.textContent='Please scan the onsite QR code to claim your drink.';return}form('<h2>Claim your free drink</h2><p id="remaining">Checking availability…</p>'+field('name','Full name / 全名')+field('email','Email / 邮箱','email')+'<p><small>Email is used only to manage this event voucher.</small></p><button>Claim voucher / 领取</button>',async d=>{const v=await api('claim',{...d,session});if(v){sessionStorage.removeItem('showcase-session');localStorage.setItem('showcase-pass',v.code);location.hash=v.code;panel.hidden=true;show(v)}});api('status').then(v=>{if(v){document.querySelector('#remaining').textContent=v.open?v.remaining+' of 60 available':'Claiming is closed';panel.querySelector('button').disabled=!v.open||!v.remaining}})};start()}}
if(mode==='distribute'){form('<h2>Onsite distribution</h2>'+field('password','Admin password','password')+'<button>Start displaying QR</button>',async d=>{const status=await api('list',d);if(!status)return;panel.hidden=true;ticket.hidden=false;let token=null;async function tick(){try{const state=await api('status');if(!state||!state.open||!state.remaining){token=null;ticket.textContent=state&&state.open?'All passes claimed':'Claiming closed';return}if(token){const p=await api('poll',{...d,token:token.token});if(!p||p.activated||Date.parse(p.expires_at)<=Date.now())token=null}if(!token){token=await api('issue',d);if(!token)return;ticket.innerHTML='<h2>Scan to claim 🧋</h2><div id="onsiteqr" style="background:white;padding:12px;width:max-content;margin:auto"></div><p id="count"></p>';new QRCode(document.querySelector('#onsiteqr'),{text:location.origin+'/?t='+token.token,width:240,height:240})}document.querySelector('#count').textContent=state.remaining+' remaining · refreshes in '+Math.max(0,Math.ceil((Date.parse(token.expires_at)-Date.now())/1000))+'s'}finally{setTimeout(tick,1500)}}tick()})}
if(mode==='staff'){form('<h2>Vendor redemption</h2>'+field('password','Staff password','password')+field('code','Voucher code / 兑换码')+'<button>Verify voucher</button>',async d=>{ticket.hidden=true;const v=await api('lookup',d);if(v){show(v);if(!v.redeemed){const b=document.createElement('button');b.textContent='Confirm redemption';ticket.append(b);b.onclick=async()=>{b.disabled=true;const r=await api('redeem',{...d,code:v.code});if(r){show(r);document.querySelector('#code').value='';}else b.disabled=false}}}})}
if(mode==='staff'){const scan=document.createElement('button');scan.textContent='Scan QR code';const reader=document.createElement('div');reader.id='reader';panel.append(scan,reader);let camera;scan.onclick=async()=>{if(camera){await camera.stop();camera=null;scan.textContent='Scan QR code';return}if(!document.querySelector('#password').value){message.textContent='Enter staff password first';return}try{camera=new Html5Qrcode('reader');await camera.start({facingMode:'environment'},{fps:10,qrbox:220},async value=>{if(!camera)return;const current=camera;camera=null;await current.stop();scan.textContent='Scan next QR code';document.querySelector('#code').value=value;panel.querySelector('form').requestSubmit()},()=>{});scan.textContent='Stop camera'}catch(e){camera=null;message.textContent='Camera unavailable. Use manual code.'}}}
if(mode==='admin'){form('<h2>Showcase admin</h2>'+field('password','Admin password','password')+'<button>View dashboard</button>',async d=>{const v=await api('list',d);if(!v)return;rows=v.rows;opened=v.open;ticket.hidden=false;ticket.innerHTML='<h2>'+rows.length+'/60 claimed</h2><p>'+rows.filter(x=>x.redeemed_at).length+' redeemed</p><button id="toggle">'+(opened?'Close claiming':'Open claiming')+'</button><button id="csv">Export CSV</button>'+rows.map(x=>'<article>'+esc(x.full_name)+'<br>'+esc(x.email)+'<br>'+esc(x.code)+'<br>'+(x.redeemed_at?'Redeemed':'Unused')+'</article>').join('');document.querySelector('#toggle').onclick=async()=>{const r=await api('toggle',{...d,open:!opened});if(r)panel.querySelector('form').requestSubmit()};document.querySelector('#csv').onclick=()=>{const cell=x=>'"'+String(x??'').replace(/^[=+@\-\t\r]/,"'$&").replaceAll('"','""')+'"';const csv=['Name,Email,Code,Claimed,Redeemed',...rows.map(x=>[x.full_name,x.email,x.code,x.created_at,x.redeemed_at].map(cell).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='showcase-vouchers.csv';a.click();URL.revokeObjectURL(a.href)}})}
</script></html>
